<html lang="it">

<title>Sakura Crossing</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;min-height:100dvh;overflow:hidden;background:#bcd8f0;
    font-family:"Hiragino Sans","Yu Gothic",-apple-system,"Segoe UI",sans-serif}
  canvas{display:block;touch-action:none;width:100%!important;height:100%!important}
  #fs{position:absolute;top:10px;right:max(12px,env(safe-area-inset-right));padding:8px 14px;border-radius:999px;
    background:rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.6);color:#463d55;font-size:11px;
    font-weight:800;letter-spacing:.06em;pointer-events:auto;backdrop-filter:blur(3px)}
  #hud{position:fixed;inset:0;pointer-events:none;z-index:5}
  .pad{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));left:max(16px,env(safe-area-inset-left));
    width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.2);
    border:2px solid rgba(255,255,255,.5);pointer-events:auto;backdrop-filter:blur(3px)}
  .nub{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;
    background:rgba(255,255,255,.82);box-shadow:0 2px 10px rgba(60,50,80,.28)}
  #run{position:absolute;bottom:max(26px,env(safe-area-inset-bottom));right:max(22px,env(safe-area-inset-right));
    width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.26);border:2px solid rgba(255,255,255,.55);
    color:#4a4358;font-size:12px;font-weight:800;letter-spacing:.08em;display:flex;align-items:center;justify-content:center;
    pointer-events:auto;backdrop-filter:blur(3px)}
  #run.on{background:rgba(226,116,157,.9);color:#fff}
  #view{position:absolute;bottom:max(112px,env(safe-area-inset-bottom));right:max(30px,env(safe-area-inset-right));
    width:58px;height:34px;border-radius:999px;background:rgba(255,255,255,.26);border:2px solid rgba(255,255,255,.55);
    color:#4a4358;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;pointer-events:auto}
  #tip{position:absolute;top:12px;left:50%;transform:translateX(-50%);color:#fff;font-size:13px;font-weight:600;
    text-shadow:0 2px 6px rgba(40,30,60,.65);opacity:0;transition:opacity .35s;text-align:center;padding:0 12px}
  #tip.show{opacity:1}
  #veil{position:fixed;inset:0;z-index:20;background:linear-gradient(160deg,#bcd8f0 0%,#e7d3e6 60%,#f7dbe4 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#584a63;
    text-align:center;padding:10px 16px;overflow:auto}
  #veil h1{font-size:clamp(24px,6.5vw,42px);font-weight:800;color:#3f3550;letter-spacing:.02em}
  #veil h1 span{color:#e2749d}
  #veil .jp{font-size:13px;letter-spacing:.5em;color:#8a7d94}
  #veil p{font-size:13.5px;max-width:420px;line-height:1.6;opacity:.85}
  #go{margin-top:6px;padding:13px 34px;border:none;border-radius:999px;background:#e2749d;color:#fff;
    font-size:15px;font-weight:800;letter-spacing:.06em;box-shadow:0 8px 20px rgba(226,116,157,.4)}
  #rotate{position:fixed;inset:0;z-index:40;background:#3f3550;color:#fff;display:none;
    flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  #rotate .ico{width:54px;height:88px;border:3px solid #fff;border-radius:10px;animation:tilt 1.6s ease-in-out infinite}
  @keyframes tilt{0%,40%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
  @media (orientation:portrait){#rotate{display:flex}}
  /* schermi molto bassi (anteprima in-app) */
  @media (max-height:460px){
    #veil h1{font-size:22px}
    #veil p{font-size:11.5px;line-height:1.4;max-width:340px}
    #veil .jp{font-size:10px}
    #go{padding:9px 26px;font-size:13px;margin-top:2px}
    .pad{width:88px;height:88px;bottom:10px;left:10px}
    .nub{width:38px;height:38px;margin:-19px 0 0 -19px}
    #run{width:56px;height:56px;font-size:10px;bottom:12px;right:12px}
    #view{width:50px;height:26px;font-size:10px;bottom:76px;right:15px}
    #fs{padding:6px 10px;font-size:10px;top:6px}
    #tip{font-size:11px;top:8px}
  }
  @media (max-height:330px){
    #veil p{display:none}
    #veil h1{font-size:18px}
  }
</style>

<div id="rotate"><div class="ico"></div><div>Gira il telefono in orizzontale</div></div>

  <h1>Sakura <span>Crossing</span></h1>

  <button id="go">INIZIA LA STORIA</button>
</div>

<script>
/* ============ base ============ */
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xf3b98c);
scene.fog=new THREE.Fog(0xf0ad86,58,380);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,560);
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
// La scena viene disegnata in lineare dentro un render target HDR: tone mapping,
// contorni a inchiostro e color grade li fa il passaggio di composizione.
renderer.outputEncoding=THREE.LinearEncoding;
renderer.toneMapping=THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
const MAXA=renderer.capabilities.getMaxAnisotropy();

const hemi=new THREE.HemisphereLight(0xffc79b,0x5b4a6e,.62);scene.add(hemi);
const rim=new THREE.DirectionalLight(0x86a6e8,.85);
rim.position.set(-26,16,22);scene.add(rim);
const amb=new THREE.AmbientLight(0x6e6f9c,.42);scene.add(amb);
// rimbalzo: l'asfalto scaldato dal sole basso rimanda luce verso l'alto.
// Senza, i sottogronda e i volti in ombra diventano piatti e spenti.
const bounce=new THREE.DirectionalLight(0xffb98a,.5);
bounce.position.set(-14,-10,-6);scene.add(bounce);
const sun=new THREE.DirectionalLight(0xffb478,1.55);
sun.position.set(30,9,-16);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const D=30;
sun.shadow.camera.left=-D;sun.shadow.camera.right=D;sun.shadow.camera.top=D;sun.shadow.camera.bottom=-D;
sun.shadow.camera.far=110;sun.shadow.bias=-.0009;sun.shadow.normalBias=.02;
scene.add(sun,sun.target);

/* ============ generatore di texture ============ */
function CT(w,h,draw,rx,ry){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=MAXA;
  t.encoding=THREE.sRGBEncoding;   // dipinte a schermo: vanno decodificate in lineare
  if(rx)t.repeat.set(rx,ry||rx);
  return t;
}
const rnd=(a,b)=>a+Math.random()*(b-a);
function noise(x,w,h,n,col,min,max){
  for(let i=0;i<n;i++){x.fillStyle=col;x.globalAlpha=rnd(.03,.12);
    const r=rnd(min,max);x.beginPath();x.arc(rnd(0,w),rnd(0,h),r,0,7);x.fill();}
  x.globalAlpha=1;
}
/* asfalto */
const asphalt=CT(256,256,(x,w,h)=>{
  x.fillStyle='#b3adbe';x.fillRect(0,0,w,h);
  noise(x,w,h,900,'#8d8798',.6,2.4);noise(x,w,h,500,'#d3ceda',.6,2);
  x.strokeStyle='rgba(120,113,130,.5)';x.lineWidth=1.4;
  for(let i=0;i<7;i++){x.beginPath();let px=rnd(0,w),py=rnd(0,h);x.moveTo(px,py);
    for(let j=0;j<7;j++){px+=rnd(-30,30);py+=rnd(-24,24);x.lineTo(px,py);}x.stroke();}
},6,26);
/* marciapiede a piastrelle */
const pave=CT(256,256,(x,w,h)=>{
  x.fillStyle='#dcd7de';x.fillRect(0,0,w,h);
  noise(x,w,h,400,'#c2bcc6',1,3);
  x.strokeStyle='#c0bac6';x.lineWidth=2.5;
  for(let i=0;i<=4;i++){x.beginPath();x.moveTo(i*64,0);x.lineTo(i*64,h);x.stroke();
    x.beginPath();x.moveTo(0,i*64);x.lineTo(w,i*64);x.stroke();}
},2,18);
/* pavimento tattile giallo */
const tenji=CT(128,128,(x,w,h)=>{
  x.fillStyle='#e8c24a';x.fillRect(0,0,w,h);
  x.fillStyle='#d1a92f';
  for(let i=0;i<4;i++)for(let j=0;j<4;j++){x.beginPath();x.arc(16+i*32,16+j*32,9,0,7);x.fill();}
},1,26);
/* ghiaia binari */
const gravel=CT(256,256,(x,w,h)=>{
  x.fillStyle='#8f8895';x.fillRect(0,0,w,h);
  for(let i=0;i<1400;i++){x.fillStyle=`hsl(${rnd(250,275)},${rnd(4,12)}%,${rnd(38,72)}%)`;
    x.beginPath();x.arc(rnd(0,w),rnd(0,h),rnd(1.2,3.6),0,7);x.fill();}
},14,1);
/* tegole kawara */
const kawara=CT(128,256,(x,w,h)=>{
  x.fillStyle='#5f6c7d';x.fillRect(0,0,w,h);
  for(let r=0;r<8;r++){
    const y=r*32;
    x.fillStyle='#6d7b8d';x.fillRect(0,y,w,26);
    x.fillStyle='#4d596a';x.fillRect(0,y+26,w,6);
    for(let c=0;c<4;c++){x.fillStyle='rgba(255,255,255,.07)';x.fillRect(c*32+2,y+2,28,10);}
  }
},4,3);
/* muro con doghe */
function siding(base,line){
  return CT(256,256,(x,w,h)=>{
    x.fillStyle=base;x.fillRect(0,0,w,h);
    noise(x,w,h,300,'#ffffff',1,3);noise(x,w,h,200,'#000000',1,3);
    x.strokeStyle=line;x.lineWidth=2;
    for(let i=0;i<8;i++){x.beginPath();x.moveTo(0,i*32+30);x.lineTo(w,i*32+30);x.stroke();}
  },2,2);
}
const wallA=siding('#efece6','#d6d1c8'), wallB=siding('#e2ded7','#cbc5bc'), wallC=siding('#dfe6e8','#c6ced1');
/* blocchi di cemento */
const blockwall=CT(256,256,(x,w,h)=>{
  x.fillStyle='#cfcad2';x.fillRect(0,0,w,h);noise(x,w,h,400,'#a9a3b0',1,3);
  x.strokeStyle='#b4aeb9';x.lineWidth=3;
  for(let r=0;r<4;r++){x.beginPath();x.moveTo(0,r*64);x.lineTo(w,r*64);x.stroke();
    for(let c=0;c<3;c++){const o=(r%2)*42;x.beginPath();x.moveTo(c*85+o,r*64);x.lineTo(c*85+o,r*64+64);x.stroke();}}
},3,1);
/* finestra */
const windowTex=CT(128,128,(x,w,h)=>{
  x.fillStyle='#9db9cd';x.fillRect(0,0,w,h);
  const g=x.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'rgba(255,255,255,.75)');g.addColorStop(.45,'rgba(255,255,255,.05)');
  g.addColorStop(.55,'rgba(255,255,255,.4)');g.addColorStop(1,'rgba(120,150,175,.3)');
  x.fillStyle=g;x.fillRect(0,0,w,h);
  x.fillStyle='#f4f1ec';x.fillRect(0,0,w,6);x.fillRect(0,h-6,w,6);x.fillRect(0,0,6,h);x.fillRect(w-6,0,6,h);
  x.fillRect(w/2-3,0,6,h);
});
/* fianco del treno */
const trainSide=CT(2048,512,(x,w,h)=>{
  x.fillStyle='#f2f5fa';x.fillRect(0,0,w,h);
  // pannellature e rivetti
  x.strokeStyle='rgba(120,128,145,.35)';x.lineWidth=2;
  for(let i=0;i<16;i++){x.beginPath();x.moveTo(i*128,0);x.lineTo(i*128,h);x.stroke();}
  x.fillStyle='rgba(150,158,175,.5)';
  for(let i=0;i<64;i++)for(let r=0;r<2;r++)x.fillRect(20+i*32,44+r*380,3,3);
  // fasce livrea
  x.fillStyle='#dfe4ec';x.fillRect(0,0,w,44);
  x.fillStyle='#2b5fc4';x.fillRect(0,330,w,74);
  x.fillStyle='#1c3f92';x.fillRect(0,404,w,16);
  x.fillStyle='#e2749d';x.fillRect(0,318,w,12);
  x.fillStyle='#8d95a6';x.fillRect(0,436,w,76);
  // finestrini accesi
  for(let i=0;i<9;i++){
    const wx=110+i*210;
    x.fillStyle='#2a2f3c';x.fillRect(wx-6,110,204,182);
    x.fillStyle='#ffd79a';x.fillRect(wx,116,192,170);
    const g=x.createLinearGradient(wx,116,wx+192,286);
    g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(.5,'rgba(255,255,255,0)');
    g.addColorStop(.62,'rgba(255,255,255,.35)');g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle=g;x.fillRect(wx,116,192,170);
    // sagome di passeggeri
    x.fillStyle='rgba(70,52,60,.55)';
    for(let k=0;k<2;k++){const px=wx+40+k*96;
      x.beginPath();x.arc(px,208,20,0,7);x.fill();
      x.fillRect(px-26,232,52,54);}
    x.fillStyle='rgba(255,255,255,.5)';x.fillRect(wx,116,192,16);
  }
  // porte scorrevoli
  [340,1180].forEach(dx=>{
    x.fillStyle='#e6eaf1';x.fillRect(dx,60,230,360);
    x.strokeStyle='#a9b0be';x.lineWidth=4;x.strokeRect(dx,60,230,360);
    x.fillStyle='#2a2f3c';x.fillRect(dx+16,96,86,150);x.fillRect(dx+128,96,86,150);
    x.fillStyle='#ffd79a';x.fillRect(dx+22,102,74,138);x.fillRect(dx+134,102,74,138);
    x.fillStyle='#b7bcc7';x.fillRect(dx+112,60,6,360);
    x.fillStyle='#2b5fc4';x.fillRect(dx+10,280,210,26);
  });
  // indicazione di linea + numero
  x.fillStyle='#22262f';x.fillRect(1560,80,300,64);
  x.fillStyle='#ffcf5a';x.font='bold 44px "Hiragino Sans",sans-serif';x.textAlign='center';
  x.fillText('各駅停車', 1710,128);
  x.fillStyle='#3a4050';x.font='bold 34px sans-serif';x.fillText('サクラ線 1042',1710,190);
  // bordo a inchiostro
  x.strokeStyle='rgba(58,48,70,.55)';x.lineWidth=8;x.strokeRect(0,0,w,h);
});
const trainEnd=CT(256,256,(x,w,h)=>{
  x.fillStyle='#eef1f6';x.fillRect(0,0,w,h);
  x.fillStyle='#2b5fc4';x.fillRect(0,168,w,40);
  x.fillStyle='#ffd79a';x.fillRect(38,56,180,86);
  x.fillStyle='rgba(255,255,255,.25)';x.fillRect(38,56,180,22);
});
/* cartello 踏切注意 */
const fumikiri=CT(256,128,(x,w,h)=>{
  x.fillStyle='#f0e9dc';x.fillRect(0,0,w,h);
  x.fillStyle='#20242c';x.fillRect(0,0,w,8);x.fillRect(0,h-8,w,8);x.fillRect(0,0,8,h);x.fillRect(w-8,0,8,h);
  x.fillStyle='#20242c';x.font='bold 54px "Hiragino Sans",sans-serif';x.textAlign='center';
  x.fillText('踏切注意',w/2,72);
  x.font='bold 22px sans-serif';x.fillStyle='#8a3b3b';
  x.fillText('とまれ みよ きけ',w/2,104);
});
/* distributore automatico */
const vendTex=CT(256,512,(x,w,h)=>{
  x.fillStyle='#d8443f';x.fillRect(0,0,w,h);
  x.fillStyle='#f2f0ec';x.fillRect(0,0,w,50);
  x.fillStyle='#2b3a6b';x.font='bold 28px sans-serif';x.textAlign='center';x.fillText('自販機',w/2,36);
  x.fillStyle='#1b2030';x.fillRect(14,62,228,238);
  for(let r=0;r<3;r++)for(let c=0;c<4;c++){
    const col=['#e8542f','#2f9c5a','#e8b32f','#2f6fe8','#f0f0f0','#8a4fd0'][(r*4+c)%6];
    x.fillStyle=col;x.fillRect(26+c*56,74+r*78,42,62);
    x.fillStyle='rgba(255,255,255,.5)';x.fillRect(28+c*56,76+r*78,10,58);
    x.fillStyle='#ffd94a';x.beginPath();x.arc(47+c*56,318+r*0,9,0,7);x.fill();
  }
  x.fillStyle='#c33a35';x.fillRect(0,306,w,60);
  for(let c=0;c<4;c++){x.fillStyle='#ffdf6b';x.beginPath();x.arc(45+c*56,336,13,0,7);x.fill();}
  x.fillStyle='#2a2f3a';x.fillRect(24,382,120,44);
  x.fillStyle='#8f96a5';x.fillRect(150,382,84,26);
  x.fillStyle='#3a3f4c';x.fillRect(14,446,228,52);
});
/* legno */
const wood=CT(128,128,(x,w,h)=>{
  x.fillStyle='#a98a6d';x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(120,92,68,.55)';x.lineWidth=2;
  for(let i=0;i<10;i++){x.beginPath();x.moveTo(0,i*13+4);
    for(let j=0;j<=8;j++)x.lineTo(j*16,i*13+4+Math.sin(j+i)*2.5);x.stroke();}
},2,2);
/* erba */
const grass=CT(128,128,(x,w,h)=>{
  x.fillStyle='#7fa564';x.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){x.fillStyle=`hsl(${rnd(85,110)},${rnd(25,45)}%,${rnd(32,58)}%)`;
    x.fillRect(rnd(0,w),rnd(0,h),2,rnd(2,5));}
},4,4);

const glowTex=CT(128,128,(x,w,h)=>{
  const g=x.createRadialGradient(64,64,2,64,64,62);
  g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(.35,'rgba(255,206,140,.45)');
  g.addColorStop(1,'rgba(255,190,120,0)');
  x.fillStyle=g;x.fillRect(0,0,w,h);
});
function petalTexPlaceholder(){return glowTex;}

/* ============ cielo al tramonto ============ */
const skyTex=CT(64,512,(x,w,h)=>{
  const g=x.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#22305e');g.addColorStop(.24,'#4d4a86');
  g.addColorStop(.45,'#9a6b95');g.addColorStop(.62,'#d97f83');
  g.addColorStop(.76,'#f2a072');g.addColorStop(.88,'#fbc98a');g.addColorStop(1,'#ffe3b4');
  x.fillStyle=g;x.fillRect(0,0,w,h);
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(390,28,22),
  new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false}));
scene.add(sky);
// disco solare + alone
(function(){
  const t=CT(256,256,(x,w,h)=>{
    const g=x.createRadialGradient(128,128,6,128,128,124);
    g.addColorStop(0,'rgba(255,246,214,1)');g.addColorStop(.14,'rgba(255,214,140,.95)');
    g.addColorStop(.4,'rgba(255,160,105,.4)');g.addColorStop(1,'rgba(255,150,100,0)');
    x.fillStyle=g;x.fillRect(0,0,w,h);
  });
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:t,transparent:true,depthWrite:false,fog:false}));
  s.scale.set(120,120,1);s.position.set(250,42,-300);scene.add(s);s.layers.set(1);
})();
/* Nuvole. Erano rettangoli con sopra una macchia sfocata: da fermi passavano,
   ma bastava muoversi per vedere che erano cartelloni piatti. Qui sono grappoli
   di sfere schiacciate con due tinte, chiara sopra e satura sotto: e' il modo in
   cui l'animazione giapponese risolve i cumuli al tramonto. */
const CLOUDS=new THREE.Group();scene.add(CLOUDS);
const cloudTop=new THREE.MeshBasicMaterial({fog:false});
const cloudBot=new THREE.MeshBasicMaterial({fog:false});
cloudTop.userData.top=true;cloudBot.userData.bot=true;
(function(){
  for(let i=0;i<26;i++){
    const cl=new THREE.Group();
    const n=4+((Math.random()*5)|0);
    let px=0;

const gradMap=(()=>{
  // r128 campiona la gradient map con .rgb: serve grigio su tutti e tre i canali.
  // Con RedFormat verde e blu restano a zero e l'intera scena diventa rossa.
  const steps=[76,150,255];   // tre fasce nette: e' la lettura piu' "cartoon"
  const data=new Uint8Array(steps.length*4);
  steps.forEach((v,i)=>{data[i*4]=data[i*4+1]=data[i*4+2]=v;data[i*4+3]=255;});
  const t=new THREE.DataTexture(data,steps.length,1,THREE.RGBAFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter;t.generateMipmaps=false;t.needsUpdate=true;
  return t;
})();

/* ============================================================
   TERRENO SOLIDO
   Finora il personaggio scivolava sopra ogni cosa come se il quartiere fosse
   liquido. Qui si registrano due categorie:
     - piani calpestabili (marciapiedi, gradini, piattaforma del passaggio):
       hanno una quota, ci si sale se il dislivello e' da gradino
     - muri (edifici, muretti, pali grossi): fermano il movimento
   Entrambi finiscono in una griglia a celle, cosi' il controllo per frame
   resta costante anche con mille edifici.
   ============================================================ */
const GROUNDED=[];   // oggetti da riappoggiare a terra quando le quote esistono
const GROUND=(()=>{
  const CELL=10;
  const plats=new Map(), walls=new Map();
  const key=(cx,cz)=>cx+','+cz;

  function insert(map,rect){
    const x0=Math.floor(rect.x0/CELL), x1=Math.floor(rect.x1/CELL);
    const z0=Math.floor(rect.z0/CELL), z1=Math.floor(rect.z1/CELL);
    for(let cx=x0;cx<=x1;cx++)for(let cz=z0;cz<=z1;cz++){
      const k=key(cx,cz);
      if(!map.has(k))map.set(k,[]);
      map.get(k).push(rect);
    }
  }
  const cellOf=(map,x,z)=>map.get(key(Math.floor(x/CELL),Math.floor(z/CELL)));

  /** piano calpestabile: centro, dimensioni, quota della superficie */
  function addPlat(cx,cz,w,d,y,ry){
    if(ry){ // ruotato di 90 gradi: basta scambiare le dimensioni
      const t=w;w=d;d=t;
    }
    insert(plats,{x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2,y});
  }
  /** ostacolo verticale */
  function addWall(cx,cz,w,d){
    insert(walls,{x0:cx-w/2,x1:cx+w/2,z0:cz-d/2,z1:cz+d/2});
  }

  /** quota del suolo calpestabile sotto un punto */
  function heightAt(x,z){
    const c=cellOf(plats,x,z);
    if(!c)return 0;
    let y=0;
    for(let i=0;i<c.length;i++){
      const r=c[i];
      if(x>=r.x0&&x<=r.x1&&z>=r.z0&&z<=r.z1&&r.y>y)y=r.y;
    }
    return y;
  }

  /** true se un cilindro di raggio r centrato qui tocca un muro */
  function blocked(x,z,r){
    const c=cellOf(walls,x,z);
    if(!c)return false;
    for(let i=0;i<c.length;i++){
      const w=c[i];
      const nx=Math.max(w.x0,Math.min(x,w.x1));
      const nz=Math.max(w.z0,Math.min(z,w.z1));
      const dx=x-nx, dz=z-nz;
      if(dx*dx+dz*dz<r*r)return true;
    }
    return false;
  }

  return {addPlat,addWall,heightAt,blocked,
          stats:()=>({plats:plats.size,walls:walls.size})};
})();

// piccolo aiuto per fondere geometrie statiche per materiale
function Batch(){
  const buckets=new Map();
  const m4=new THREE.Matrix4(), q=new THREE.Quaternion(), e=new THREE.Euler();
  return {
    add(geo,mat,x,y,z,rx,ry,rz,uvx,uvy){
      if(uvx||uvy){
        const uv=geo.attributes.uv;
        for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*(uvx||1),uv.getY(i)*(uvy||1));
      }
      e.set(rx||0,ry||0,rz||0);q.setFromEuler(e);
      m4.compose(new THREE.Vector3(x,y,z),q,new THREE.Vector3(1,1,1));
      geo.applyMatrix4(m4);
      if(!buckets.has(mat))buckets.set(mat,[]);
      buckets.get(mat).push(geo);
    },
    flush(parent,cast,receive){
      buckets.forEach((list,mat)=>{
        const merged=THREE.BufferGeometryUtils.mergeBufferGeometries(list,false);
        list.forEach(g=>g.dispose());
        if(!merged)return;
        const mesh=new THREE.Mesh(merged,mat);
        mesh.castShadow=!!cast;mesh.receiveShadow=!!receive;
        mesh.userData.merged=true;   // gia' in coordinate assolute: non traslarla
        parent.add(mesh);
      });
      buckets.clear();
    }
  };
}

(function pratoBucato(){
  const s=new THREE.Shape();
  s.moveTo(-220,-220);s.lineTo(220,-220);s.lineTo(220,220);s.lineTo(-220,220);s.closePath();

  x.fillStyle='#b8b4ad';x.fillRect(0,0,w,h);
  noise(x,w,h,420,'#9a968f',2,8);noise(x,w,h,260,'#d0ccc4',2,7);
  x.strokeStyle='rgba(120,116,110,.5)';x.lineWidth=2;
  for(let i=1;i<4;i++){x.beginPath();x.moveTo(0,i*64);x.lineTo(w,i*64);x.stroke();}
  x.fillStyle='rgba(105,101,95,.55)';
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){
    x.beginPath();x.arc(32+c*64,32+r*64,4,0,7);x.fill();
  }
  // colature di ruggine dai fori
  for(let i=0;i<10;i++){
    x.fillStyle='rgba(140,105,70,.18)';
    x.fillRect(rnd(0,w),rnd(0,h*.6),rnd(2,5),rnd(20,70));
  }
},2,2);

/* cartello verde autostradale */
const signTex=CT(512,256,(x,w,h)=>{
  x.fillStyle='#1f6b47';x.fillRect(0,0,w,h);
  x.strokeStyle='#f2f0e8';x.lineWidth=8;x.strokeRect(14,14,w-28,h-28);
  x.fillStyle='#f2f0e8';
  x.font='bold 62px "Hiragino Sans",sans-serif';x.textAlign='center';
  x.fillText('桜ヶ丘',w/2,96);
  x.font='bold 34px sans-serif';
  x.fillText('Sakuragaoka',w/2,146);
  x.font='bold 40px sans-serif';x.fillText('1.2 km',w/2,206);
  // freccia
  x.fillStyle='#f2f0e8';x.beginPath();
  x.moveTo(64,150);x.lineTo(104,150);x.lineTo(104,120);x.lineTo(144,165);
  x.lineTo(104,210);x.lineTo(104,180);x.lineTo(64,180);x.closePath();x.fill();
});

(function buildExpressway(){
  const B=Batch();
  const CONC=M({map:concTex}), TILE=M({map:tileTex});
  const DECKM=M({map:asphalt.clone()});
  const PARA=C(0xc4bfb6), STEELB=C(0x8f959e), RUST=C(0x8a6f52);
  const NEON=new THREE.MeshBasicMaterial({color:0xdff0ff});NEON.color.convertSRGBToLinear();
  const SIGNM=M({map:signTex}), PAINT=C(0xeeeaf0), YEL=C(0xe8c24a), BLK=C(0x2a2730);
  const Z=EXPWY.z, Y=EXPWY.y, W=EXPWY.w, G=EXPWY.gap, D=EXPWY.deep;

  // ---------------------------------------------------------------- impalcato
  // cassone continuo con sbalzi laterali: la sezione classica di una via aerea
  const L=EXPWY.to-EXPWY.from, CX=(EXPWY.from+EXPWY.to)/2;
  B.add(new THREE.BoxGeometry(L,.55,W),CONC,CX,Y-.3,Z,0,0,0,L/6,W/6);      // soletta
  B.add(new THREE.BoxGeometry(L,1.5,W*.62),CONC,CX,Y-1.3,Z,0,0,0,L/6,3);   // cassone
  [-1,1].forEach(k=>{
    // nervatura di bordo inclinata sotto lo sbalzo
    B.add(new THREE.BoxGeometry(L,.9,1.4),CONC,CX,Y-1.0,Z+k*W*.40,0,0,k*.5,L/6,1);
    // parapetto pieno + corrimano
    B.add(new THREE.BoxGeometry(L,1.15,.34),PARA,CX,Y+.55,Z+k*(W/2-.2),0,0,0,L/4,1);
    B.add(new THREE.BoxGeometry(L,.14,.5),STEELB,CX,Y+1.16,Z+k*(W/2-.2));
  });
  // manto, spartitraffico e strisce
  B.add(new THREE.BoxGeometry(L,.1,W-1.2),DECKM,CX,Y+.03,Z,0,0,0,L/6,3);
  B.add(new THREE.BoxGeometry(L,.5,.7),PARA,CX,Y+.25,Z);                    // new jersey centrale
  for(let x=EXPWY.from+4;x<EXPWY.to;x+=8){
    [-1,1].forEach(k=>B.add(new THREE.BoxGeometry(4,.03,.18),PAINT,x,Y+.09,Z+k*4.2));
  }
  // giunti di dilatazione ogni campata
  for(let x=EXPWY.from;x<=EXPWY.to;x+=EXPWY.span)
    B.add(new THREE.BoxGeometry(.22,.12,W),STEELB,x,Y+.09,Z);

  // ---------------------------------------------------------------- pile a T
  for(let x=EXPWY.from+EXPWY.span/2;x<EXPWY.to;x+=EXPWY.span){
    if(Math.abs(x)<G+3)continue;                       // qui ci sono le spalle
    B.add(new THREE.BoxGeometry(2.4,Y-2.2,2.4),CONC,x,(Y-2.2)/2,Z,0,0,0,1,3);
    B.add(new THREE.BoxGeometry(3.2,.9,W*.7),CONC,x,Y-2.2+.45,Z,0,0,0,1,2);   // pulvino
    B.add(new THREE.BoxGeometry(3.6,.5,3.6),CONC,x,.25,Z);                    // plinto
    // appoggi in gomma sotto l'impalcato
    [-1,1].forEach(k=>B.add(new THREE.CylinderGeometry(.28,.28,.35,8),BLK,x,Y-1.9,Z+k*3.2));
    GROUND.addWall(x,Z,3.6,3.6);
  }

  // ---------------------------------------------------------------- spalle e sottopasso
  // Due muri pieni ai lati della carreggiata; in mezzo la scatola che si attraversa.
  [-1,1].forEach(k=>{
    const wx=k*(G+D/2);
    B.add(new THREE.BoxGeometry(D,Y-1.6,W+1.2),CONC,wx,(Y-1.6)/2,Z,0,0,0,3,3);
    GROUND.addWall(wx,Z,D,W+1.2);
    // muro d'ala che accompagna la strada in entrata e in uscita
    [-1,1].forEach(s=>{
      B.add(new THREE.BoxGeometry(1.0,4.2,7),CONC,k*(G+.5),2.1,Z+s*(W/2+3.4),0,0,0,1,2);
      B.add(new THREE.BoxGeometry(1.4,.4,7),PARA,k*(G+.5),4.35,Z+s*(W/2+3.4));
    });
  });
  // solaio del sottopasso: e' il soffitto che si vede passandoci sotto
  B.add(new THREE.BoxGeometry(G*2,.7,W+1.2),CONC,0,EXPWY.clear+.35,Z,0,0,0,3,3);
  // rivestimento a piastrelle sulle pareti interne
  [-1,1].forEach(k=>{
    B.add(new THREE.BoxGeometry(.12,EXPWY.clear,W+1.1),TILE,k*(G-.06),EXPWY.clear/2,Z,0,0,0,4,2);
    // fascia scura di zoccolatura
    B.add(new THREE.BoxGeometry(.16,.9,W+1.1),C(0x5f6a72),k*(G-.09),.45,Z);
  });
  // soffitto a piastrelle e plafoniere al neon
  B.add(new THREE.BoxGeometry(G*2-.3,.1,W+1),TILE,0,EXPWY.clear-.06,Z,0,0,0,4,2);
  for(let z=Z-W/2;z<=Z+W/2;z+=3.2){
    B.add(new THREE.BoxGeometry(2.2,.16,.5),NEON,0,EXPWY.clear-.2,z);
    B.add(new THREE.BoxGeometry(2.6,.2,.7),STEELB,0,EXPWY.clear-.08,z);
  }
  // marciapiedi rialzati dentro il sottopasso, con ringhiera
  [-1,1].forEach(k=>{
    const px=k*(G-1.3);
    B.add(new THREE.BoxGeometry(2.4,.42,W+1.1),M({map:pave.clone()}),px,.21,Z,0,0,0,1,4);
    GROUND.addPlat(px,Z,2.4,W+1.1,.42);
    for(let z=Z-W/2;z<=Z+W/2;z+=1.6)
      B.add(new THREE.BoxGeometry(.08,1.0,.08),STEELB,k*(G-2.4),.92,z);
    B.add(new THREE.BoxGeometry(.1,.1,W+1.1),STEELB,k*(G-2.4),1.44,Z);
  });
  // canaletta di scolo con griglia, al centro carreggiata
  for(let z=Z-W/2;z<=Z+W/2;z+=1.2)
    B.add(new THREE.BoxGeometry(.5,.06,1.0),C(0x5d5866),0,.05,z);

  // portale con limite di altezza, giallo e nero, a entrambe le imboccature
  [-1,1].forEach(s=>{
    const pz=Z+s*(W/2+2.2);
    [-1,1].forEach(k=>B.add(new THREE.CylinderGeometry(.16,.2,5.4,8),STEELB,k*(G-.6),2.7,pz));
    B.add(new THREE.BoxGeometry(G*2-1.2,.42,.3),YEL,0,EXPWY.clear-.35,pz);
    for(let i=-4;i<=4;i++)
      B.add(new THREE.BoxGeometry(1.0,.42,.32),BLK,i*2.2,EXPWY.clear-.35,pz,0,0,0);
    B.add(new THREE.BoxGeometry(1.5,.9,.12),C(0xf2efe6),0,EXPWY.clear+.6,pz);
  });

  // ---------------------------------------------------------------- arredo della via aerea
  for(let x=EXPWY.from+12;x<EXPWY.to;x+=34){
    // lampioni alti, alternati sui due lati
    const k=((x/34)|0)%2?1:-1;
    B.add(new THREE.CylinderGeometry(.1,.14,4.6,7),STEELB,x,Y+2.9,Z+k*(W/2-.4));
    B.add(new THREE.BoxGeometry(.9,.2,.4),STEELB,x,Y+5.1,Z+k*(W/2-1.1));
    B.add(new THREE.BoxGeometry(.8,.1,.32),NEON,x,Y+4.98,Z+k*(W/2-1.1));
  }
  // barriere antirumore su un tratto: pannelli su montanti
  for(let x=-150;x<-60;x+=2.2){
    B.add(new THREE.BoxGeometry(2.1,3.0,.12),C(0xa8b0b8),x,Y+2.6,Z-W/2+.1);
    B.add(new THREE.BoxGeometry(.16,3.2,.3),STEELB,x-1.05,Y+2.7,Z-W/2+.1);
  }
  // cartello verde a bandiera sopra la carreggiata
  B.add(new THREE.CylinderGeometry(.22,.26,6,8),STEELB,42,Y+3,Z+W/2-.5);
  B.add(new THREE.BoxGeometry(.3,.3,9),STEELB,42,Y+5.7,Z+W/2-5);
  B.add(new THREE.BoxGeometry(5.2,2.6,.16),SIGNM,42,Y+4.4,Z+W/2-8.4);
  // scarichi che scendono lungo le pile
  for(let x=EXPWY.from+EXPWY.span/2;x<EXPWY.to;x+=EXPWY.span*2){
    if(Math.abs(x)<G+3)continue;
    B.add(new THREE.CylinderGeometry(.12,.12,Y-2,6),RUST,x+1.4,(Y-2)/2,Z+W*.34);
  }

  B.flush(scene,true,true);

  // luce dentro il sottopasso: senza, la scatola diventa un buco nero
  const l1=new THREE.PointLight(0xcfe6ff,1.5,26);l1.position.set(0,EXPWY.clear-.6,Z);
  scene.add(l1);
})();

/* ============================================================
   RAMPA ELICOIDALE E AREA COMMERCIALE
   La rampa e' lo svincolo a spirale che sale da terra fino all'impalcato:
   una vera strada, con pendenza costante, parapetti su entrambi i bordi e pile
   che scendono a terra. In cima un rettilineo la raccorda alla sopraelevata.
   Di fianco, il tipo di roba che in Giappone cresce sempre sotto un viadotto:
   supermercato col parcheggio, konbini, agenzia immobiliare, famiglia
   ristorante con l'insegna a palo e una sala pachinko.
   ============================================================ */
const RAMP={cx:56, cz:-96, R:21, turns:1.5, w:8.2, top:EXPWY.y};

/* --- texture dell'area commerciale --- */
const superTex=CT(512,256,(x,w,h)=>{

  noise(x,w,h,300,'#d6d0c4',2,6);
  x.fillStyle='#1f5fa8';x.fillRect(0,0,w,74);            // fascia dell'insegna
  x.fillStyle='#f7f4ec';x.font='bold 54px "Hiragino Sans",sans-serif';x.textAlign='center';
  x.fillText('スーパー みどり',w/2,54);
  // vetrata continua con manifesti delle offerte
  x.fillStyle='#20242c';x.fillRect(16,92,w-32,140);
  for(let i=0;i<7;i++){
    x.fillStyle='#cfe3f2';x.fillRect(26+i*68,100,58,124);
    x.fillStyle='rgba(255,255,255,.45)';x.fillRect(26+i*68,100,58,34);
    if(i%2===0){x.fillStyle='#e03b2f';x.fillRect(30+i*68,150,50,26);
      x.fillStyle='#fff';x.font='bold 20px sans-serif';x.fillText('特価',55+i*68,169);}

},1,1);

  // le tre fasce colorate sopra la vetrina, marchio di fabbrica dei konbini
  x.fillStyle='#e8792f';x.fillRect(0,10,w,16);
  x.fillStyle='#2f8f5a';x.fillRect(0,26,w,16);
  x.fillStyle='#1f5fa8';x.fillRect(0,42,w,16);
  x.fillStyle='#20242c';x.fillRect(12,74,w-24,158);
  for(let i=0;i<6;i++){
    x.fillStyle='#ffe6b0';x.fillRect(22+i*82,82,70,142);   // interno acceso
    x.fillStyle='rgba(255,255,255,.4)';x.fillRect(22+i*82,82,70,30);
    x.fillStyle='rgba(90,80,70,.35)';x.fillRect(28+i*82,150,58,10); // scaffali
    x.fillRect(28+i*82,178,58,10);

},1,1);

const agencyTex=CT(256,256,(x,w,h)=>{
  x.fillStyle='#efe9dc';x.fillRect(0,0,w,h);
  x.fillStyle='#8a2f2a';x.fillRect(0,8,w,44);
  x.fillStyle='#f4f0e6';x.font='bold 30px "Hiragino Sans",sans-serif';x.textAlign='center';
  x.fillText('さくら不動産',w/2,40);
  x.fillStyle='#20242c';x.fillRect(10,66,w-20,150);
  // i fogli degli annunci appesi in vetrina, tutti uguali e tutti diversi
  for(let r=0;r<3;r++)for(let c=0;c<4;c++){

    x.fillStyle='#c2b8a8';
    for(let l=0;l<4;l++)x.fillRect(22+c*58,80+r*48+l*8,rnd(20,40),3);

},1,1);

const pachinkoTex=CT(256,512,(x,w,h)=>{

(function buildRampAndShops(){
  const B=Batch();
  const CONC=M({map:concTex}), ASF=M({map:asphalt.clone()}), PAVE=M({map:pave.clone()});
  const PARA=C(0xc4bfb6), STEELB=C(0x8f959e), PAINT=C(0xeeeaf0), YEL=C(0xe8c24a);
  const GLASSM=C(0x9fbcd0), TRIMM=C(0xe8e2d6), ROOFM=C(0x59616e), BRICK=C(0xc98f6a);
  const NEON2=new THREE.MeshBasicMaterial({color:0xfff0c8});NEON2.color.convertSRGBToLinear();
  const LITW=new THREE.MeshBasicMaterial({color:0xffd79a});LITW.color.convertSRGBToLinear();
  const SUPER=M({map:superTex}), KONB=M({map:konbiniTex}),
        AGEN=M({map:agencyTex}), PACH=M({map:pachinkoTex});

  /* ---------------------------------------------------------------- rampa */
  const SEG=64;                                  // segmenti per giro
  const total=Math.round(SEG*RAMP.turns);
  const dTheta=(Math.PI*2*RAMP.turns)/total;
  const arc=RAMP.R*dTheta;                       // lunghezza di un segmento
  const rise=RAMP.top/total;                     // salita per segmento
  const pitch=Math.atan2(rise,arc);              // pendenza costante, ~5%

  for(let i=0;i<total;i++){
    const th=i*dTheta+dTheta/2;
    const x=RAMP.cx+Math.cos(th)*RAMP.R;
    const z=RAMP.cz+Math.sin(th)*RAMP.R;
    const y=(i+.5)*rise;
    // la carreggiata guarda lungo la tangente: yaw = -theta
    const yaw=-th;
    const L=arc*1.06;                             // sovrapposizione, niente fessure
    B.add(new THREE.BoxGeometry(L,.42,RAMP.w),CONC,x,y,z,0,yaw,pitch,L/3,RAMP.w/4);
    B.add(new THREE.BoxGeometry(L,.08,RAMP.w-.9),ASF,x,y+.24,z,0,yaw,pitch,L/3,2);
    // parapetti: quello esterno piu' alto, come nelle rampe vere
    [-1,1].forEach(k=>{
      const px=x+Math.sin(yaw)*0-Math.sin(th)*0;
      const ox=Math.cos(th)*k*(RAMP.w/2-.1), oz=Math.sin(th)*k*(RAMP.w/2-.1);
      const hgt=k>0?1.15:.95;
      B.add(new THREE.BoxGeometry(L,hgt,.3),PARA,x+ox,y+hgt/2+.2,z+oz,0,yaw,pitch,L/3,1);
      B.add(new THREE.BoxGeometry(L,.12,.42),STEELB,x+ox,y+hgt+.24,z+oz,0,yaw,pitch);
    });
    // mezzeria
    if(i%2===0)B.add(new THREE.BoxGeometry(L*.5,.03,.18),PAINT,x,y+.29,z,0,yaw,pitch);
    // pile ogni otto segmenti
    if(i%8===4&&y>1.4){
      B.add(new THREE.CylinderGeometry(.85,1.05,y-.2,10),CONC,x,(y-.2)/2,z,0,0,0,1,3);
      B.add(new THREE.BoxGeometry(3.4,.7,3.4),CONC,x,y-.55,z,0,yaw,0,1,1);
      B.add(new THREE.BoxGeometry(3.2,.45,3.2),CONC,x,.22,z);
      GROUND.addWall(x,z,2.2,2.2);
    }
  }
  // rettilineo di raccordo dall'uscita della spirale all'impalcato
  const exX=RAMP.cx+Math.cos(Math.PI*2*RAMP.turns)*RAMP.R;
  const exZ=RAMP.cz+Math.sin(Math.PI*2*RAMP.turns)*RAMP.R;
  const linkZ0=exZ, linkZ1=EXPWY.z+EXPWY.w/2;
  const linkLen=Math.abs(linkZ1-linkZ0), linkC=(linkZ0+linkZ1)/2;
  B.add(new THREE.BoxGeometry(RAMP.w,.42,linkLen),CONC,exX,RAMP.top,linkC,0,0,0,2,linkLen/4);
  B.add(new THREE.BoxGeometry(RAMP.w-.9,.08,linkLen),ASF,exX,RAMP.top+.24,linkC,0,0,0,2,linkLen/4);
  [-1,1].forEach(k=>{
    B.add(new THREE.BoxGeometry(.3,1.05,linkLen),PARA,exX+k*(RAMP.w/2-.1),RAMP.top+.72,linkC,0,0,0,1,linkLen/4);
    B.add(new THREE.BoxGeometry(.42,.12,linkLen),STEELB,exX+k*(RAMP.w/2-.1),RAMP.top+1.28,linkC);
  });
  for(let z=linkZ0;z>linkZ1;z-=9){
    B.add(new THREE.CylinderGeometry(.8,1,RAMP.top-.3,10),CONC,exX,(RAMP.top-.3)/2,z,0,0,0,1,3);
    B.add(new THREE.BoxGeometry(3.2,.45,3.2),CONC,exX,.22,z);
    GROUND.addWall(exX,z,2.2,2.2);
  }

  // imbocco a terra: raccordo, isola spartitraffico e cartello di svincolo
  const enX=RAMP.cx+RAMP.R, enZ=RAMP.cz;
  B.add(new THREE.BoxGeometry(RAMP.w,.1,26),ASF,enX,.05,enZ+13,0,0,0,2,5);
  B.add(new THREE.BoxGeometry(2.4,.28,7),PAVE,enX,.14,enZ+22,0,0,0,1,2);   // isola
  [-1,1].forEach(k=>B.add(new THREE.CylinderGeometry(.09,.09,1.1,7),YEL,enX+k*1,.55,enZ+22));
  B.add(new THREE.CylinderGeometry(.14,.18,4.4,8),STEELB,enX-5.6,2.2,enZ+16);
  B.add(new THREE.BoxGeometry(3.2,1.5,.14),M({map:signTex}),enX-5.6,4.6,enZ+16,0,-.5,0);

  /* ---------------------------------------------------------------- negozi */
  // parcheggio con stalli segnati: e' quello che rende credibile un supermercato
  function carPark(px,pz,cols,rows,ry){
    const W=cols*2.6, D=rows*5.2;
    B.add(new THREE.BoxGeometry(W,.1,D),ASF,px,.05,pz,0,ry,0,W/6,D/6);
    for(let c=0;c<=cols;c++)
      B.add(new THREE.BoxGeometry(.14,.03,4.8),PAINT,px-W/2+c*2.6,.11,pz,0,ry,0);
    if(rows>1)B.add(new THREE.BoxGeometry(W,.03,.16),PAINT,px,.11,pz,0,ry,0);
    // cordolo perimetrale e paletti
    [-1,1].forEach(k=>B.add(new THREE.BoxGeometry(W,.22,.2),C(0xd7d2da),px,.11,pz+k*D/2,0,ry,0));
    for(let c=0;c<cols;c+=3)
      B.add(new THREE.CylinderGeometry(.07,.07,.7,6),YEL,px-W/2+1.3+c*2.6,.35,pz-D/2+.4,0,ry,0);
  }

  function supermarket(px,pz,ry){
    const W=26,D=18,H=6.4;
    B.add(new THREE.BoxGeometry(W,H,D),C(0xeae4d8),px,H/2,pz,0,ry,0,4,1);
    B.add(new THREE.BoxGeometry(W+1,.7,D+1),ROOFM,px,H+.35,pz,0,ry,0);
    // fronte vetrato con l'insegna
    B.add(new THREE.BoxGeometry(W-1,5.2,.3),SUPER,px+Math.sin(ry)*(D/2+.15),3.2,pz+Math.cos(ry)*(D/2+.15),0,ry,0);
    // pensilina d'ingresso su pilastrini
    B.add(new THREE.BoxGeometry(10,.4,4.4),TRIMM,px+Math.sin(ry)*(D/2+2.2),4.3,pz+Math.cos(ry)*(D/2+2.2),0,ry,0);
    [-4.2,4.2].forEach(o=>B.add(new THREE.CylinderGeometry(.16,.16,4.1,8),STEELB,
      px+Math.cos(ry)*o+Math.sin(ry)*(D/2+4.2),2.05,pz-Math.sin(ry)*o+Math.cos(ry)*(D/2+4.2)));
    // gruppi frigo sul tetto, condotti e parapetto tecnico

function house(x,z,rot,w,d,h,floors){

  const wm=wallMats[(Math.random()*wallMats.length)|0];
  const trim=[0xf2ede4,0xe6dccd,0xdfe7e6][(Math.random()*3)|0];

  /* corpo + zoccolatura */

  const plinth=box(w+.34,.55,d+.34,C(0xbdb3a8),0,.27,0,g);ink(plinth,1.03);
  box(w+.4,.12,d+.4,C(0x9c9288),0,.56,0,g);

  // angolari verticali

                     box(.18,h-.5,.18,C(trim),k*(w/2-.02),h/2,-d/2+.02,g);});

  /* tetto in tegole: falde ricavate dalla larghezza, timpano, travetti a vista */
  const roof=new THREE.Group();roof.position.y=h;g.add(roof);
  // La pendenza e la lunghezza della falda si ricavano dalla larghezza: con
  // valori fissi le due falde non si incontrano al colmo sulle case larghe, e
  // resta una fessura o una sovrapposizione.
  const sporto=.75;                                  // sporgenza di gronda
  const semi=w/2+sporto;                             // mezza luce, gronda inclusa
  const salita=Math.min(2.2,Math.max(1.15,w*.20));   // alzata del colmo
  const falda=Math.hypot(semi,salita);
  const pend=Math.atan2(salita,semi);
  const prof=d+sporto*2;
  const rTex=M({map:kawara.clone()});
  rTex.map.repeat.set(Math.max(2,w/2.2),Math.max(2,prof/2.6));

  [-1,1].forEach(k=>{

    so.rotation.z=-k*pend;so.castShadow=false;

  // timpano: il triangolo di chiusura in testa alle falde. Senza, dai lati si
  // vede il vuoto sotto il tetto ed e' il difetto che si nota di piu'.
  [-1,1].forEach(k=>{
    const tri=new THREE.Shape();
    tri.moveTo(-w/2,0); tri.lineTo(w/2,0); tri.lineTo(0,salita*(w/2)/semi); tri.closePath();
    const tm=new THREE.Mesh(new THREE.ShapeGeometry(tri),M({map:wallA.clone()}));

  // antenna TV e parabola

/* ============ le due case attraversate dal treno ============
   Invece di spostarle, la casa resta e alla base si apre una galleria ad arco
   in mattoni: il treno ci passa dentro e l'abitazione continua sopra. La casa
   normale viene costruita dalla stessa house() e semplicemente sollevata alla
   quota della chiave d'arco, cosi' non perde un solo dettaglio. */
/* opt.luce e opt.imposta allargano il portale, opt.yaw gira il passaggio:
   quello del treno corre lungo x, quello della via principale lungo z. */
function casaGalleria(x,z,rot,w,d,h,opt){
  opt=opt||{};
  const LUCE=opt.luce||4.4;             // larghezza netta del passaggio
  const IMPOSTA=opt.imposta||3.4;       // quota da cui parte la curva
  const RAG=LUCE/2;                     // raggio dell'arco a tutto sesto
  const BASE=IMPOSTA+RAG+.55;           // quota a cui appoggia la casa

  const mattone=M({map:blockwall.clone()});
  mattone.map.repeat.set(3,2);
  const conci=C(0xc9b8a4);              // conci del portale, piu' chiari
  const b=new THREE.Group();b.position.set(x,0,z);b.rotation.y=opt.yaw||0;scene.add(b);

  // spalle piene ai due lati del passaggio, per tutta la profondita'
  [-1,1].forEach(k=>{
    const sp=(w-LUCE)/2;
    box(d+.4,BASE,sp,mattone,0,BASE/2,k*(LUCE+sp)/2,b);
    // conci d'angolo a vista
    for(let i=0;i<Math.round(BASE/.7);i++)
      box(d+.5,.34,.34,conci,0,.35+i*.7,k*(LUCE/2+.16),b);
  });

  // arco a tutto sesto: conci disposti sulla semicirconferenza, non un tubo
  const nConci=Math.max(13,Math.round(RAG*4));
  for(let i=0;i<nConci;i++){
    const a=Math.PI*(i+.5)/nConci;
    const cz=Math.cos(a)*RAG, cy=IMPOSTA+Math.sin(a)*RAG;
    const c=box(d+.4,.5,Math.PI*RAG/nConci*1.12,mattone,0,cy,cz,b);
    c.rotation.x=-a+Math.PI/2;
  }
  // ghiera in rilievo sulle due imboccature
  [-1,1].forEach(f=>{
    for(let i=0;i<nConci;i++){
      const a=Math.PI*(i+.5)/nConci;
      const g2=box(.3,.62,Math.PI*RAG/nConci*1.14,conci,
                   f*(d/2+.14),IMPOSTA+Math.sin(a)*RAG,Math.cos(a)*RAG,b);
      g2.rotation.x=-a+Math.PI/2;
    }
    // piedritti della ghiera fino a terra
    [-1,1].forEach(k=>box(.3,IMPOSTA,.62,conci,f*(d/2+.14),IMPOSTA/2,k*RAG,b));
  });

  // architrave e cornice su cui poggia l'abitazione
  box(d+.9,.55,w+.5,conci,0,BASE-.28,0,b);
  box(d+.6,.22,w+.2,C(0x9c9288),0,BASE+.02,0,b);

  // segni d'uso: macchia di fuliggine in chiave e lampada nel passaggio
  box(d*.9,.06,LUCE*.8,C(0x4a4048),0,IMPOSTA+RAG-.12,0,b).castShadow=false;
  const lum=box(.5,.12,.3,new THREE.MeshBasicMaterial({color:0xfff0c8}),0,IMPOSTA+RAG-.3,0,b);
  lum.castShadow=false;
  const pl=new THREE.PointLight(0xffd9a0,.9,12);pl.position.set(0,IMPOSTA+RAG-.5,0);b.add(pl);

  // e sopra, la casa vera, sollevata alla quota dell'architrave
  const g=house(x,z,rot,w,d,h);
  g.position.y=BASE;
  return g;
}

/* Mamachari, la bici da città giapponese. Prima era un fascio di scatole
   incrociate e per giunta inclinata su un asse sbagliato, che con la rotazione
   del gruppo la faceva sprofondare nel marciapiede. Qui è costruita sul serio:
   telaio a collo basso, forcella, cavalletto, cestino, parafanghi. */
function bike(x,z,ry,col){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=ry;scene.add(g);
  GROUNDED.push(g);                       // si appoggia alla quota reale del suolo
  const frame=C(col), dark=C(0x24222b), chrome=C(0xc4c8cf),
        rubber=C(0x2b2830), sad=C(0x3a2f2c), basket=C(0xb9bec7);
  const R=.335;                           // raggio ruota
  const FRONT=.58, BACK=-.58;             // interasse

  // ---- ruote: cerchione, copertone, raggi, mozzo. Giacciono nel piano ZY.
  [FRONT,BACK].forEach(p=>{
    const tyre=new THREE.Mesh(new THREE.TorusGeometry(R,.042,8,22),rubber);
    tyre.position.set(0,R,p);tyre.rotation.y=Math.PI/2;
    tyre.castShadow=true;g.add(tyre);
    const rim=new THREE.Mesh(new THREE.TorusGeometry(R-.055,.018,6,22),chrome);
    rim.position.set(0,R,p);rim.rotation.y=Math.PI/2;g.add(rim);
    for(let i=0;i<7;i++){
      const sp=new THREE.Mesh(new THREE.BoxGeometry(.012,(R-.06)*2,.012),chrome);
      sp.position.set(0,R,p);sp.rotation.x=(i/7)*Math.PI;g.add(sp);
    }
    const hub=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.09,8),chrome);
    hub.position.set(0,R,p);hub.rotation.x=Math.PI/2;g.add(hub);
    // parafango: un arco sopra la ruota
    const fen=new THREE.Mesh(new THREE.TorusGeometry(R+.06,.03,4,12,Math.PI*.8),frame);
    fen.position.set(0,R,p);fen.rotation.set(0,Math.PI/2,Math.PI*.1);
    fen.castShadow=true;g.add(fen);
  });

  // ---- telaio: un tubo fra due punti, cosi' le angolazioni tornano da sole
  const tube=(x1,y1,z1,x2,y2,z2,r,mat)=>{
    const a=new THREE.Vector3(x1,y1,z1), b=new THREE.Vector3(x2,y2,z2);
    const d=new THREE.Vector3().subVectors(b,a);
    const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),7),mat||frame);
    m.position.copy(a).add(b).multiplyScalar(.5);
    m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());
    m.castShadow=true;g.add(m);return m;
  };
  const BB=[0,.30,-.06];                  // movimento centrale
  const HEAD=[0,.72,FRONT-.10];           // sterzo
  const SEAT=[0,.74,BACK+.18];            // piantone sella

  tube(...BB,...HEAD,.028);               // tubo obliquo, il collo basso da citta'
  tube(...BB,...SEAT,.026);               // piantone
  tube(HEAD[0],HEAD[1],HEAD[2],SEAT[0],SEAT[1]-.02,SEAT[2],.022);   // superiore
  tube(...BB,0,R,BACK,.022);              // foderi bassi
  tube(SEAT[0],SEAT[1]-.04,SEAT[2],0,R,BACK,.018);                  // foderi alti
  tube(HEAD[0],HEAD[1]-.04,HEAD[2],0,R,FRONT,.023,chrome);          // forcella

  // ---- manubrio, sella, pedali, cavalletto, fanale
  const stem=tube(HEAD[0],HEAD[1],HEAD[2],0,.95,FRONT-.14,.02,chrome);
  const bar=new THREE.Mesh(new THREE.CylinderGeometry(.018,.018,.52,7),chrome);
  bar.position.set(0,.96,FRONT-.15);bar.rotation.z=Math.PI/2;
  bar.castShadow=true;g.add(bar);
  [-1,1].forEach(k=>{
    const grip=new THREE.Mesh(new THREE.CylinderGeometry(.026,.026,.11,7),dark);
    grip.position.set(k*.21,.96,FRONT-.15);grip.rotation.z=Math.PI/2;g.add(grip);
  });
  const saddle=new THREE.Mesh(new THREE.SphereGeometry(.09,10,7),sad);
  saddle.scale.set(.62,.42,1.25);saddle.position.set(0,.80,BACK+.20);
  saddle.castShadow=true;g.add(saddle);

  const crank=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,.02,12),chrome);
  crank.position.set(.045,.30,-.06);crank.rotation.z=Math.PI/2;g.add(crank);
  [-1,1].forEach(k=>{
    const ped=new THREE.Mesh(new THREE.BoxGeometry(.05,.02,.11),dark);
    ped.position.set(k*.11,.30+k*.09,-.06);g.add(ped);
  });
  // cavalletto laterale: e' quello che la tiene in piedi, quindi inclina il gruppo
  const stand=new THREE.Mesh(new THREE.CylinderGeometry(.015,.015,.32,6),dark);
  stand.position.set(-.12,.15,BACK+.16);stand.rotation.z=.34;g.add(stand);

  const bskt=new THREE.Mesh(new THREE.BoxGeometry(.34,.24,.26),basket);
  bskt.position.set(0,.86,FRONT+.02);bskt.castShadow=true;g.add(bskt);
  const rack=new THREE.Mesh(new THREE.BoxGeometry(.22,.03,.34),chrome);
  rack.position.set(0,.62,BACK-.02);g.add(rack);
  const lamp=new THREE.Mesh(new THREE.CylinderGeometry(.045,.05,.07,8),chrome);
  lamp.position.set(0,.80,FRONT+.06);lamp.rotation.x=Math.PI/2;g.add(lamp);

  // appoggiata sul cavalletto: inclinazione attorno all'asse di marcia, non a caso
  g.rotation.order='YZX';
  g.rotation.z=-.085;
}

/* ============ costruttore di umanoidi ============ */
const clothTex=CT(128,128,(x,w,h)=>{
  x.fillStyle='#ffffff';x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(0,0,0,.06)';x.lineWidth=1;
  for(let i=0;i<32;i++){x.beginPath();x.moveTo(i*4,0);x.lineTo(i*4,h);x.stroke();
    x.beginPath();x.moveTo(0,i*4);x.lineTo(w,i*4);x.stroke();}
  noise(x,w,h,220,'#000000',1,2.5);noise(x,w,h,220,'#ffffff',1,2.5);
},3,3);
const skinTex=CT(64,64,(x,w,h)=>{
  x.fillStyle='#ffffff';x.fillRect(0,0,w,h);noise(x,w,h,60,'#e8b49a',1,3);
});
function faceTex(o){
  return CT(512,256,(x,w,h)=>{
    x.fillStyle=o.skin||'#f7dcc6';x.fillRect(0,0,w,h);
    // il volto sta al centro della UV: u=0.5 guarda in avanti
    const cx=256, cy=128;
    // guance
    x.fillStyle='rgba(240,150,150,.35)';
    [-1,1].forEach(k=>{x.beginPath();x.ellipse(cx+k*52,cy+22,26,14,0,0,7);x.fill();});
    // occhi grandi in stile anime
    [-1,1].forEach(k=>{
      const ex=cx+k*46, ey=cy-2;
      x.fillStyle='#2b2430';x.beginPath();x.ellipse(ex,ey,17,22,0,0,7);x.fill();
      x.fillStyle=o.eye||'#4a6b9c';x.beginPath();x.ellipse(ex,ey+2,12,17,0,0,7);x.fill();
      x.fillStyle='#1b1620';x.beginPath();x.ellipse(ex,ey+4,6,10,0,0,7);x.fill();
      x.fillStyle='#ffffff';x.beginPath();x.ellipse(ex-5,ey-8,5,6,0,0,7);x.fill();
      x.fillStyle='rgba(255,255,255,.7)';x.beginPath();x.ellipse(ex+5,ey+9,3,3,0,0,7);x.fill();
      // ciglia
      x.strokeStyle='#2b2430';x.lineWidth=6;x.beginPath();
      x.moveTo(ex-18,ey-16);x.quadraticCurveTo(ex,ey-27,ex+18,ey-15);x.stroke();
      // sopracciglia
      x.lineWidth=5;x.strokeStyle=o.brow||'#5a4038';x.beginPath();
      x.moveTo(ex-16,ey-36);x.quadraticCurveTo(ex,ey-44,ex+16,ey-34);x.stroke();
    });
    // naso e bocca
    x.fillStyle='rgba(190,140,120,.6)';x.beginPath();x.ellipse(cx,cy+26,4,3,0,0,7);x.fill();
    x.strokeStyle='#a75d5d';x.lineWidth=5;x.lineCap='round';x.beginPath();
    if(o.smile!==false){x.moveTo(cx-14,cy+46);x.quadraticCurveTo(cx,cy+58,cx+14,cy+46);}
    else{x.moveTo(cx-12,cy+50);x.lineTo(cx+12,cy+50);}
    x.stroke();
  });
}
function limb(r1,r2,len,mat,parent,y){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,len,10),mat);
  m.position.y=y;m.castShadow=true;m.receiveShadow=true;parent.add(m);ink(m,1.07);return m;
}
function joint(r,mat,parent,y){
  const m=new THREE.Mesh(new THREE.SphereGeometry(r,10,8),mat);
  m.position.y=y;m.castShadow=true;parent.add(m);return m;
}
/* Corporature.
   Finora ogni abitante era lo stesso identico corpo ridipinto: a colori diversi
   restavano sei bambole uguali. Questi cinque numeri cambiano la costruzione,
   non la taglia — scalare tutto uniformemente fa solo persone piccole, non un
   bambino ne' un anziano. Un bambino ha la testa grande rispetto al corpo, un
   uomo robusto ha spalle larghe e torace pieno, una vecchia sta curva. */
function makeHuman(o){
  o=o||{};
  const TESTA=o.testa||1,      // testa rispetto al corpo: >1 infantile, <1 adulta
        SPALLE=o.spalle||1,    // larghezza delle spalle
        TORACE=o.torace||1,    // pienezza di busto e bacino
        ARTI=o.arti||1,        // grossezza di braccia e gambe
        CURVA=o.curva||0;      // busto piegato in avanti, per l'eta'
  const skinM=M({map:skinTex,color:o.skin||0xf7dcc6});
  const topM=M({map:clothTex,color:o.top||0xf6f2ec});
  const botM=M({map:clothTex,color:o.bottom||0x3d4668});
  const shoeM=C(o.shoe||0x3a3440);
  const hairM=C(o.hair||0x453742);
  const root=new THREE.Group();
  if(o.scale)root.scale.setScalar(o.scale);

  const hips=new THREE.Group();hips.position.y=.92;root.add(hips);

  /* Busto rivoluzionato da un profilo, non un cilindro con una palla sopra.
     Un tubo a raggio costante non ha spalle ne' vita: da qualunque angolo legge
     come un barattolo. Il profilo passa per collo, spalla, torace, vita e fianco,
     e la rivoluzione lo rende continuo. Schiacciato in z perche' un torso umano
     e' piu' largo che profondo: una sezione circolare legge subito come robot. */
  function rivolta(prof,mat,pz){
    // il profilo va dato dal basso verso l'alto: al contrario le facce nascono
    // rivoltate e il corpo diventa trasparente, con dentro la cartella
    const g=new THREE.LatheGeometry(prof.slice().reverse()
      .map(p=>new THREE.Vector2(p[0]*TORACE,p[1])),20);
    const m=new THREE.Mesh(g,mat);m.scale.z=pz;m.castShadow=true;m.receiveShadow=true;
    hips.add(m);return m;
  }
  const busto=rivolta([[.048,.645],[.105,.612],[.152,.556],[.176,.487],[.181,.408],
                       [.170,.318],[.155,.232],[.148,.168],[.158,.098],[.163,.052],
                       [.140,.020],[.02,.006]],topM,.79);
  const bacino=rivolta([[.02,.086],[.132,.074],[.166,.016],[.172,-.040],
                        [.150,-.098],[.092,-.132],[.02,-.146]],botM,.86);
  /* colletto alla marinara: e' la sagoma che rende leggibile la divisa.
     Un anello attorno al collo da lontano legge come una sciarpa; servono la
     pala sulle spalle, le due bande sul petto e il fiocco. */
  const colM=C(o.collar||0x2b5fc4);
  const pala=new THREE.Mesh(new THREE.BoxGeometry(.34*SPALLE,.03,.2),colM);
  pala.position.set(0,.585,-.075);pala.rotation.x=-.22;hips.add(pala);ink(pala,1.05);
  [-1,1].forEach(k=>{                       // bande che scendono a V sul petto
    const b=new THREE.Mesh(new THREE.BoxGeometry(.075,.24,.03),colM);
    b.position.set(k*.075,.5,.15);b.rotation.set(-.12,0,k*.2);hips.add(b);
  });
  const nodo=new THREE.Mesh(new THREE.BoxGeometry(.07,.06,.04),C(o.tie||0xd8556f));
  nodo.position.set(0,.4,.17);hips.add(nodo);
  const cinta=new THREE.Mesh(new THREE.CylinderGeometry(.153,.158,.06,14),C(o.belt||0x2f3550));
  cinta.position.y=.055;hips.add(cinta);ink(cinta,1.05);   // vita segnata
  if(o.skirt){
    const sk=new THREE.Mesh(new THREE.ConeGeometry(.32,.42,16,1,true),botM);
    sk.position.y=-.06;sk.castShadow=true;hips.add(sk);
    const skm=new THREE.Mesh(new THREE.ConeGeometry(.325,.42,16,1,true),
      new THREE.MeshBasicMaterial({color:0x3b3046,side:THREE.BackSide}));
    skm.position.y=-.06;skm.scale.setScalar(1.04);hips.add(skm);
  }
  if(o.apron){
    const ap=new THREE.Mesh(new THREE.PlaneGeometry(.3,.42),C(o.apron));
    ap.position.set(0,.2,.17);hips.add(ap);
  }

  /* collo e testa */
  const neck=limb(.06,.07,.12,skinM,hips,.66);
  /* Testa piu' grande: il corpo stava a circa sei teste, proporzione da figura
     realistica. In un mondo cartoon, e visto da cinque metri, non si legge.
     A ~4.8 teste la sagoma si riconosce a distanza e l'insieme diventa cartoon
     per costruzione, non per colore. */
  const headP=new THREE.Group();headP.position.y=.78;headP.scale.setScalar(1.26*TESTA);hips.add(headP);
  const face=faceTex({skin:o.skinCss||'#f7dcc6',eye:o.eye||'#4a6b9c',brow:o.browCss,smile:o.smile});
  /* Una sfera non e' una testa: manca la mascella, e senza mento il volto legge
     come un pallone dipinto. Si stringe la meta' inferiore lasciando intatta
     quella superiore, cosi' la calotta resta tonda e nasce il mento.
     Si tocca la posizione dei vertici, non le UV: occhi e bocca restano dove
     stanno, e sotto l'equatore il viso si affusola invece di gonfiarsi. */
  function mandibola(g,r,k){
    const p=g.attributes.position;
    for(let i=0;i<p.count;i++){
      const y=p.getY(i);
      if(y>=0)continue;
      const t=Math.min(1,-y/r), s=1-(1-k)*t*t;
      p.setX(i,p.getX(i)*s);p.setZ(i,p.getZ(i)*s);
    }
    p.needsUpdate=true;g.computeVertexNormals();return g;
  }
  const head=new THREE.Mesh(mandibola(new THREE.SphereGeometry(.145,20,16),.145,.60),M({map:face}));
  head.rotation.y=-Math.PI/2;head.scale.set(1,1.08,.98);head.castShadow=true;headP.add(head);ink(head,1.045);
  // capelli: calotta + nuca aperta sul viso
  const cap=new THREE.Mesh(new THREE.SphereGeometry(.157,18,14,0,6.3,0,1.05),hairM);
  cap.position.y=.004;cap.castShadow=true;headP.add(cap);ink(cap,1.05);
  // L'apertura della capigliatura va centrata su +z, dove guarda il volto.
  // La sfera della faccia e' ruotata di -PI/2 per portare la UV davanti, ma i
  // capelli pendono da headP e quella rotazione non la vedono: lasciando il buco
  // a phi=PI finiva sull'asse +x e da davanti si vedevano capelli fino alla bocca.
  const VISO=Math.PI/2;                        // phi che guarda in avanti
  // la nuca scende sotto l'equatore: va stretta come il cranio, o sborda dal mento
  const back=new THREE.Mesh(mandibola(
    new THREE.SphereGeometry(.155,18,14,VISO+.95,2*Math.PI-1.9,0,2.1),.155,.60),hairM);
  back.castShadow=true;headP.add(back);
  // ciocche della frangia
  for(let i=0;i<5;i++){
    const st=new THREE.Mesh(new THREE.SphereGeometry(.045,8,6),hairM);
    st.scale.set(1,1.9,.7);st.position.set(-.05+i*.028,.09,.13);
    st.rotation.z=(i-2)*.18;st.position.x=(i-2)*.05;headP.add(st);
  }
  if(o.pony){
    const py=new THREE.Mesh(new THREE.SphereGeometry(.085,12,10),hairM);
    py.scale.set(1,1.9,1);py.position.set(0,-.05,-.19);headP.add(py);ink(py,1.06);
    const tie=new THREE.Mesh(new THREE.TorusGeometry(.05,.02,6,10),C(o.tie||0xe2749d));
    tie.rotation.y=Math.PI/2;tie.position.set(0,.06,-.17);headP.add(tie);
  }
  if(o.bun){
    const bn=new THREE.Mesh(new THREE.SphereGeometry(.075,12,10),hairM);
    bn.position.set(0,.13,-.1);headP.add(bn);ink(bn,1.06);
  }
  if(o.hat){
    const ht=new THREE.Mesh(new THREE.CylinderGeometry(.15,.16,.1,14),C(o.hat));
    ht.position.y=.13;ht.castShadow=true;headP.add(ht);ink(ht,1.05);
    const br=new THREE.Mesh(new THREE.CylinderGeometry(.24,.24,.02,16),C(o.hat));
    br.position.y=.09;headP.add(br);
  }
  // orecchie
  [-1,1].forEach(k=>{const e=new THREE.Mesh(new THREE.SphereGeometry(.035,8,6),skinM);
    e.scale.set(.6,1,1);e.position.set(k*.14,-.01,0);headP.add(e);});

  /* braccia: spalla, gomito, mano */
  /* Le giunture si vedevano perche' la sfera era piu' grossa del cilindro che
     attaccava: ogni gomito faceva una pallina. Qui il raggio della sfera e'
     esattamente quello dell'estremita' che tocca, cosi' l'arto sembra continuo. */
  function arm(side){
    const manica=o.bare?skinM:topM;
    const sh=new THREE.Group();sh.position.set(side*.185*SPALLE,.487,0);hips.add(sh);
    const dl=joint(.066*ARTI,manica,sh,0);dl.scale.set(1,1.15,1);   // deltoide, non spigolo
    limb(.066*ARTI,.050*ARTI,.30,manica,sh,-.165);
    if(!o.bare){                    // bordo manica: senza, manica bianca e pelle
      const cf=new THREE.Mesh(new THREE.CylinderGeometry(.052,.052,.035,12),colM);
      cf.position.y=-.30;sh.add(cf);   // chiara si fondevano in un bastoncino
    }
    const el=new THREE.Group();el.position.y=-.32;sh.add(el);
    joint(.050*ARTI,skinM,el,0);
    limb(.050*ARTI,.040*ARTI,.27,skinM,el,-.15);
    const polso=joint(.040*ARTI,skinM,el,-.285);
    const hand=new THREE.Mesh(new THREE.SphereGeometry(.052,10,8),skinM);
    hand.scale.set(.78,1.25,.55);hand.position.y=-.335;el.add(hand);   // palmo piatto
    const poll=new THREE.Mesh(new THREE.SphereGeometry(.021,7,6),skinM);
    poll.scale.set(1,1.5,1);poll.position.set(side*-.038,-.31,.012);el.add(poll);
    return {sh,el};
  }
  const aL=arm(-1),aR=arm(1);

  /* gambe: anca, ginocchio, piede */
  function leg(side){
    const calza=o.socks?C(o.socks):botM;
    // con la gonna la coscia e' pelle: lasciandola del colore dei pantaloni,
    // fra orlo e calzino restava una fascia scura che legge come collant
    const cosciaM=o.skirt?skinM:botM;
    const hp=new THREE.Group();hp.position.set(side*.098*TORACE,-.02,0);hips.add(hp);
    joint(.084*ARTI,botM,hp,0);
    limb(.084*ARTI,.064*ARTI,.42,cosciaM,hp,-.23);
    const kn=new THREE.Group();kn.position.y=-.44;hp.add(kn);
    joint(.064*ARTI,calza,kn,0);
    limb(.064*ARTI,.048*ARTI,.40,calza,kn,-.21);
    joint(.048*ARTI,calza,kn,-.405);                  // caviglia
    /* La scarpa era una scatola: da vicino e' l'unico spigolo vivo del corpo.
       Un ellissoide allungato in avanti da' punta e collo del piede. */
    const ft=new THREE.Mesh(new THREE.SphereGeometry(.078,12,9),shoeM);
    ft.scale.set(.92,.58,1.55);ft.position.set(0,-.432,.042);
    ft.castShadow=true;kn.add(ft);
    return {hp,kn};
  }
  const lL=leg(-1),lR=leg(1);

  if(o.bag){
    const bg=new THREE.Mesh(new THREE.BoxGeometry(.3,.36,.16),C(o.bag));
    bg.position.set(0,.34,-.19);bg.castShadow=true;hips.add(bg);ink(bg,1.06);
    const fl=new THREE.Mesh(new THREE.BoxGeometry(.3,.1,.17),C(o.bag));
    fl.position.set(0,.5,-.19);hips.add(fl);
    [-1,1].forEach(k=>{const str=new THREE.Mesh(new THREE.BoxGeometry(.05,.36,.04),C(o.bag));
      str.position.set(k*.13,.42,-.02);hips.add(str);});
  }
  if(o.scarf){
    const sc=new THREE.Mesh(new THREE.TorusGeometry(.12,.045,7,14),C(o.scarf));
    sc.rotation.x=Math.PI/2;sc.position.y=.62;hips.add(sc);
  }

  if(CURVA){
    hips.rotation.x=CURVA;              // il busto si china
    headP.rotation.x=-CURVA*.78;        // ma lo sguardo resta sulla strada
  }
  // quota di riposo del bacino: chi sta curvo perde qualche centimetro, e pose()
  // deve ripartire da qui invece che dal .92 fisso, o a ogni frame lo rialza
  const BASEY=.92-CURVA*.10;
  hips.position.y=BASEY;
  const H={root,hips,headP,legL:lL.hp,legR:lR.hp,kneeL:lL.kn,kneeR:lR.kn,
    armL:aL.sh,armR:aR.sh,elbL:aL.el,elbR:aR.el,
    pose(t,amp){
      const a=amp===undefined?1:amp;
      const s=Math.sin(t)*.62*a, c=Math.cos(t);
      // le gambe pendono dal bacino: se il busto si piega in avanti ruotano con
      // lui e i piedi finiscono dietro. Si sottrae la curva per rimetterle a piombo.
      H.legL.rotation.x=s-CURVA;H.legR.rotation.x=-s-CURVA;
      H.kneeL.rotation.x=-Math.max(0,Math.sin(t+1.1))*.95*a;
      H.kneeR.rotation.x=-Math.max(0,Math.sin(t+1.1+Math.PI))*.95*a;
      H.armL.rotation.x=-s*.72;H.armR.rotation.x=s*.72;
      H.elbL.rotation.x=-Math.abs(s)*.35-.12;H.elbR.rotation.x=-Math.abs(s)*.35-.12;
      H.hips.position.y=BASEY+Math.abs(Math.sin(t))*.035*a;
      H.hips.rotation.z=Math.sin(t)*.03*a;
      H.hips.rotation.y=Math.sin(t)*.05*a;
      H.headP.rotation.z=-Math.sin(t)*.03*a;
    },
    lookAt(v){
      const dx=v.x-root.position.x, dz=v.z-root.position.z;
      const local=Math.atan2(dx,dz)-root.rotation.y;
      H.headP.rotation.y=Math.max(-.9,Math.min(.9,Math.atan2(Math.sin(local),Math.cos(local))));
    }};
  return H;
}

/* ============================================================
   ALLARGAMENTO DELLA VIA PRINCIPALE
   Il quartiere storico era disegnato attorno a una carreggiata di 13 metri,
   con una quarantina di coordinate scritte a mano. Invece di riscriverle tutte
   si allarga il blocco a costruzione finita: tutto cio' che stava oltre il
   bordo strada si sposta in fuori della stessa quantita', e i rapporti fra
   marciapiede, cordolo, recinzioni e case restano quelli di prima.
   ============================================================ */
const WIDEN=0;                       // il quartiere storico resta com'era:
                                     // la varieta' di larghezza sta nei quartieri nuovi
(function widenQuarter(){
  const EDGE=5.9;                    // oltre questa ascissa si e' fuori dalla strada
  for(let i=QUARTER_FROM;i<scene.children.length;i++){
    const o=scene.children[i];
    if(o.userData.merged)continue;   // la citta' fusa e' gia' alla scala giusta
    if(o.isLine){
      // i fili sono in coordinate assolute dentro la geometria
      const p=o.geometry.attributes.position;
      for(let k=0;k<p.count;k++){
        const x=p.getX(k);
        if(Math.abs(x)>EDGE)p.setX(k,x+Math.sign(x)*WIDEN);
      }
      p.needsUpdate=true;
      o.geometry.computeBoundingSphere();
      continue;
    }
    if(Math.abs(o.position.x)>EDGE)o.position.x+=Math.sign(o.position.x)*WIDEN;
  }
  // i dati che descrivono il mondo vanno spostati con lui
  houses.forEach(h=>{if(Math.abs(h[0])>EDGE)h[0]+=Math.sign(h[0])*WIDEN;});
})();

/* ============================================================
   COSA E' SOLIDO
   Marciapiedi e piattaforme diventano piani calpestabili; case, muretti e
   pali diventano ostacoli. Da qui in poi il personaggio sale sui cordoli e
   sbatte contro i muri invece di attraversarli.
   ============================================================ */
(function solidify(){
  const SW=8+WIDEN;                    // asse dei marciapiedi della via principale

  // marciapiedi rialzati lungo tutta l'arteria
  [-1,1].forEach(k=>{
    GROUND.addPlat(k*SW,0,3.2,440,.36);
    GROUND.addPlat(k*(SW-1.5),0,.3,440,.42);   // cordolo: gradino d'attacco
  });
  // piattaforma del passaggio a livello
  GROUND.addPlat(0,0,13.6,5.6,.42);

  // marciapiedi dei quartieri generati: il generatore ne ha lasciato l'elenco
  STREET_SEGS.forEach(t=>GROUND.addPlat(t.x,t.z,t.w,t.d,t.y));

  // edifici della citta' generata
  BUILDINGS.forEach(b=>GROUND.addWall(b.x,b.z,b.r*1.9,b.r*1.9));

  // case del quartiere storico: corpo piu' un margine per il giardinetto
  houses.forEach(h=>{
    const [x,z,rot,w,d]=h;
    const horiz=Math.abs(Math.cos(rot))<.5;
    GROUND.addWall(x,z,horiz?d:w,horiz?w:d);
  });

  // muretti di cinta lungo la via principale
  const FW=10.2+WIDEN;
  [[-FW,-30,-3],[-FW,4,30],[FW,-30,-3],[FW,4,30]].forEach(([x,z0,z1])=>{
    GROUND.addWall(x,(z0+z1)/2,.6,z1-z0);
  });

  // pali della luce e della corrente: piccoli ma si sentono addosso
  for(let z=-30;z<=30;z+=12)GROUND.addWall(-8.9-WIDEN,z,.5,.5);

  // props appoggiati: adesso che le quote esistono, si posano davvero
  GROUNDED.forEach(o=>{o.position.y=GROUND.heightAt(o.position.x,o.position.z);});
})();

/* ============================================================
   IL FIUME
   Un corso d'acqua urbano giapponese: canale incassato fra due sponde di
   cemento, largo quarantaquattro metri, che taglia il quartiere da parte a
   parte. La via principale lo scavalca su un ponte stradale.
   L'acqua e' disegnata, non simulata: niente riflessi ne' rifrazione, ma tinte
   piatte a fasce nette e onde tracciate a mano che scorrono. Un'acqua
   fotografica in mezzo a una scena cel shaded stona piu' di una finta.
   ============================================================ */
const acquaTex=CT(512,512,(x,w,h)=>{
  x.fillStyle='#6aa8c8';x.fillRect(0,0,w,h);            // tinta piena, niente gradiente
  // seconda fascia piu' scura a chiazze morbide: da' profondita' restando piatta

    x.ellipse(cx,cy,r,r*.55,Math.random()*3,0,7);x.fill();
  }
  // creste: tratti bianchi spessi, pochi e grandi, con la codina — sono queste
  // che leggono come "cartoon" e non i puntini fini
  x.strokeStyle='#f2fbff';x.lineCap='round';
  for(let i=0;i<26;i++){
    const cx=Math.random()*w, cy=Math.random()*h, l=40+Math.random()*70;
    x.lineWidth=5+Math.random()*4;
    x.beginPath();x.moveTo(cx,cy);
    x.bezierCurveTo(cx+l*.3,cy-9,cx+l*.7,cy+9,cx+l,cy-2);x.stroke();
    x.lineWidth=3;
    x.beginPath();x.moveTo(cx+l*.15,cy+13);x.quadraticCurveTo(cx+l*.4,cy+19,cx+l*.62,cy+12);x.stroke();
  }
});
acquaTex.wrapS=acquaTex.wrapT=THREE.RepeatWrapping;
