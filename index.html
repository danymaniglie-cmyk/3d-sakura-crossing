const FIUME_G=(()=>{
  const g=new THREE.Group();scene.add(g);
  const L=FIUME.a-FIUME.da, W=FIUME.sem*2;

  // fondo del canale
  const fondo=plane(L,W,M({map:rivaTex}),0,FIUME.fondo,FIUME.z);
  fondo.receiveShadow=true;g.add(fondo);

  /* Acqua vera: THREE.Water dagli esempi ufficiali della r128, vendorizzato
     come three.js stesso. Non e' piu' un disegno che scorre — riflette il cielo
     e le sponde con una camera speculare, e deforma il riflesso con una normal
     map animata. Le librerie nuove (Water Pro, Tidewater) fanno di piu' ma
     vogliono TSL e WebGPU, cioe' three.js r160+: qui riscriverebbero il motore.

     La normal map non e' un file: come ogni altra texture del progetto viene
     dipinta su canvas. Si costruisce un campo di altezze a somma di seni e se
     ne ricava la pendenza punto per punto — il colore di una normal map E' la
     pendenza, non un disegno di onde. */
  const normAcqua=(()=>{
    const N=256, c=document.createElement('canvas');c.width=c.height=N;
    const x=c.getContext('2d'), img=x.createImageData(N,N);
    const K=Math.PI*2/N;
    const h=(u,v)=>Math.sin(u*K*3)*1.0+Math.sin((u*2+v*3)*K*2)*.7
                  +Math.sin((v*5-u)*K*1.5)*.5+Math.sin((u*7+v*5)*K)*.25;
    for(let v=0;v<N;v++)for(let u=0;u<N;u++){
      // differenze centrali: la pendenza in x e in y attorno al punto
      const dx=h((u+1)%N,v)-h((u-1+N)%N,v);
      const dy=h(u,(v+1)%N)-h(u,(v-1+N)%N);
      const nx=-dx*.5, ny=-dy*.5, nz=1;
      const len=Math.hypot(nx,ny,nz), o=(v*N+u)*4;
      img.data[o  ]=(nx/len*.5+.5)*255;
      img.data[o+1]=(ny/len*.5+.5)*255;
      img.data[o+2]=(nz/len*.5+.5)*255;
      img.data[o+3]=255;
    }
    x.putImageData(img,0,0);
    const t=new THREE.CanvasTexture(c);
    t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=MAXA;
    return t;                       // niente sRGB: e' un dato, non un colore
  })();

  const onda=new THREE.PlaneGeometry(L,W,176,18);
  const acqua=new THREE.Water(onda,{
    textureWidth:512, textureHeight:512,
    waterNormals:normAcqua,
    sunDirection:new THREE.Vector3(0,1,0),
    sunColor:0xffe6c4, waterColor:0x3f6f8c,
    distortionScale:4.4, fog:!!scene.fog, alpha:1.0
  });
  acqua.rotation.x=-Math.PI/2;
  acqua.position.set(0,FIUME.y,FIUME.z);
  acqua.layers.enable(1);      // fuori dal prepass dei contorni
  g.add(acqua);

  /* Luccichii: puntini che salgono e scendono col riflesso e si accendono a
     tempi sfasati. Sono loro a dare il brillio, che una texture che scorre non
     puo' produrre — il brillio e' una cosa che lampeggia, non che trasla. */
  const glint=(()=>{
    const N=260, gg=new THREE.BufferGeometry(), a=new Float32Array(N*3), semi=[];
    for(let i=0;i<N;i++){
      a[i*3]=FIUME.da+Math.random()*(FIUME.a-FIUME.da);
      a[i*3+1]=FIUME.y+.09;
      a[i*3+2]=FIUME.z+(Math.random()-.5)*(W-4);
      semi.push({f:.6+Math.random()*1.9, p:Math.random()*6.3});
    }
    gg.setAttribute('position',new THREE.BufferAttribute(a,3));
    const pm=new THREE.PointsMaterial({size:.62,map:glowTex,color:0xffffff,
      transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending});
    const pts=new THREE.Points(gg,pm);pts.layers.enable(1);g.add(pts);
    return {gg,pm,semi};
  })();

  // schiuma lungo le sponde: una striscia bianca che pulsa, il segno piu'
  // riconoscibile dell'acqua disegnata
  const schiuma=[];
  [-1,1].forEach(k=>{
    const t=CT(512,64,(x,w,h)=>{
      x.clearRect(0,0,w,h);
      x.fillStyle='#ffffff';
      for(let i=0;i<40;i++){
        const cx=i*(w/40)+Math.random()*6, r=9+Math.random()*11;
        x.beginPath();x.ellipse(cx,h*.55,r,r*.42,0,0,7);x.fill();
      }
      x.globalCompositeOperation='destination-out';
      for(let i=0;i<30;i++){
        const cx=Math.random()*w;
        x.beginPath();x.ellipse(cx,h*.2,10+Math.random()*14,8,0,0,7);x.fill();
      }
    });
    t.wrapS=THREE.RepeatWrapping;t.repeat.set(L/12,1);
    const m=plane(L,3.0,new THREE.MeshBasicMaterial({map:t,transparent:true,
      opacity:.85,depthWrite:false}),0,FIUME.y+.05,FIUME.z+k*(FIUME.sem-1.4));
    m.layers.enable(1);g.add(m);schiuma.push(t);
  });

  /* sponde: muro verticale di cemento, cordolo in cima, ringhiera.
     Il muro e' anche cio' che impedisce di cadere in acqua. */
  [-1,1].forEach(k=>{
    const zb=FIUME.z+k*FIUME.sem;
    const muro=box(L,3.6,.9,M({map:cementoTex}),0,FIUME.fondo+1.8,zb+k*.45,g);
    muro.receiveShadow=true;
    box(L,.34,1.5,M({map:pave}),0,.15,zb+k*1.2,g);          // cordolo/camminamento
    for(let x=FIUME.da+3;x<FIUME.a;x+=3.2){
      if(Math.abs(x)<9)continue;                              // varco del ponte
      cyl(.05,.05,1.0,C(0x9aa3ab),x,.8,zb+k*.62,6,g);
      GROUND.addWall(x,zb+k*.62,.4,.4);
    }
    const cor=box(L,.09,.09,C(0x9aa3ab),0,1.28,zb+k*.62,g);
    GROUND.addPlat(0,zb+k*1.2,L,1.5,.32);
    /* Barriera contro la caduta nel canale, ma spezzata sul varco del ponte:
       una parete continua avrebbe murato la via principale sulle due rive,
       chiudendo il quartiere invece di collegarlo. */
    [[FIUME.da,-11],[11,FIUME.a]].forEach(([x0,x1])=>
      GROUND.addWall((x0+x1)/2,zb+k*.62,x1-x0,.5));
  });

  /* Il ponte della via principale. L'asfalto e i marciapiedi sono piani lunghi
     quattrocento metri che passavano sopra il canale sospesi sul niente: qui si
     costruisce cio' che li regge, non la carreggiata, che c'e' gia'. */
  const PB={sem:FIUME.sem+4.5, larg:23};
  const solet=box(PB.larg,.62,PB.sem*2,M({map:cementoTex}),0,-.33,FIUME.z,g);
  solet.receiveShadow=true;
  for(let k=-1;k<=1;k+=2){                      // travi longitudinali sotto
    [0,1].forEach(j=>box(1.0,.85,PB.sem*2,M({map:cementoTex}),
      k*(3.2+j*4.4),-1.0,FIUME.z,g));
  }
  [-1,1].forEach(k=>{                           // pile in acqua, a cavalletto
    const zp=FIUME.z+k*(FIUME.sem*.52);
    box(PB.larg-3,1.0,2.2,M({map:cementoTex}),0,-1.8,zp,g);
    [-1,1].forEach(j=>{
      const pil=cyl(1.05,1.25,FIUME.fondo*-1+1.4,M({map:cementoTex}),
        j*6.4,(FIUME.fondo+1.0)/2-.6,zp,10,g);
      pil.receiveShadow=true;
    });
  });
  [-1,1].forEach(k=>{                           // parapetti del ponte
    const x=k*(PB.larg/2-.6);
    box(.34,.95,PB.sem*2,M({map:cementoTex}),x,.60,FIUME.z,g);
    box(.5,.14,PB.sem*2,C(0x8d95a0),x,1.14,FIUME.z,g);
    GROUND.addWall(x,FIUME.z,.5,PB.sem*2);
  });
  // sotto il ponte l'acqua resta, ma niente schiuma: la si spezza sul varco
  return {g,acqua,schiuma,onda,glint};
})();

/* ============================================================
   LA RAMPA E IL VIADOTTO
   Niente spirali: una rampa dritta che parte a terra davanti all'arco, sale con
   pendenza costante, piega in curva e poi corre diritta fino a innestarsi sulla
   sopraelevata che c'era gia'. La quota d'arrivo non e' scelta — e' quella
   dell'impalcato esistente, 9.2 m, perche' i due si devono incontrare.
   La pendenza si ricava dalla lunghezza percorsa, non si scrive a mano: cosi'
   resta costante anche cambiando il tracciato.
   ============================================================ */
const VIA={w:8.4, top:EXPWY.y};

(function rampaEViadotto(){
  const B=Batch();
  const CONC=M({map:cementoTex}), ASF=M({map:asphalt}),
        PARA=M({map:cementoTex,color:0xd8d4cc}), PAINT=C(0xf0ecd8),
        STEEL=C(0x9aa3ab);

  // Tracciato in pianta: attacco a terra davanti all'arco, curva larga, rettilineo.
  /* Attacca a terra oltre l'arco, scavalca il fiume di fianco al ponte
     stradale, prosegue a nord finche' non ha preso quota, poi curva largo e
     torna in quota sopra i quartieri di levante fino alla sopraelevata.
     E' lungo a posta: con trecento metri la pendenza sta sotto il cinque per
     cento, cioe' una salita d'autostrada — piana ma che sale. */
  /* Il tracciato e' scritto RISPETTO ALL'ARCO, non in coordinate assolute:
     ogni coppia dice "tanti metri a destra dell'arco, tanti a nord". Cosi'
     spostare tutto il ponte e' una riga sola — SCOSTA — invece di riscrivere
     quindici coordinate a mano, e se un domani l'arco si sposta il ponte lo
     segue da solo.
     Il rettilineo ha tutti i punti sulla stessa ascissa: viene dritto per
     costruzione, non per fortuna. La curva comincia solo dopo il fiume. */
  const SCOSTA={x:12, z:22};        // <— sposta l'intero blocco del ponte
  const REL=[[22,-22],[22,-2],[22,18],[22,38],[22,58],[24,76],[36,90],
             [62,96],[90,81],[105,53],[109,18],[111,-22],[112,-52]];
  const P=REL.map(([dx,dz])=>[ARCO.x+dx+SCOSTA.x, ARCO.z+dz+SCOSTA.z]);
  /* La coda invece NON segue lo scostamento: deve restare cucita alla
     sopraelevata, che sta dove sta. Spostando anche questa, il ponte finiva
     quaranta metri prima del punto d'innesto — collegato a niente. */
  const xF=P[P.length-1][0];
  P.push([xF+3, EXPWY.z+26], [xF+9, EXPWY.z+9], [xF+18, EXPWY.z], [xF+34, EXPWY.z]);
  const curva=new THREE.CatmullRomCurve3(
    P.map(p=>new THREE.Vector3(p[0],0,p[1])),false,'catmullrom',.35);

  const N=260;
  const pt=curva.getPoints(N);
  // lunghezze cumulate: servono per distribuire la salita in modo uniforme
  const acc=[0];
  for(let i=1;i<=N;i++)acc.push(acc[i-1]+Math.hypot(pt[i].x-pt[i-1].x,pt[i].z-pt[i-1].z));
  const LTOT=acc[N];
  const SALITA=6;                  // pochi metri in piano, poi si sale
  /* Pendenza costante, non una curva a esse. Il raccordo dolce sembrava
     elegante ma teneva l'impalcato a ventisei centimetri per sessanta metri:
     in mezzo alla carreggiata leggeva come un cordolo, non come un ponte.
     Solo gli ultimi metri si addolciscono, per arrivare in piano sull'altro. */
  /* L'impalcato e' spesso mezzo metro ed e' centrato sulla quota: partendo da
     zero il suo asfalto restava 28 cm sopra quello della strada, cioe' un
     gradino invece di un raccordo. Si parte da -0.25 perche' le due superfici
     combacino, e si arriva comunque a VIA.top, che e' la quota dell'impalcato
     esistente. Pendenza costante in mezzo. */
  const GIU=-.25;
  const quota=s=>{
    const t=Math.max(0,Math.min(1,(s-SALITA)/(LTOT-SALITA-26)));
    return GIU+(VIA.top-GIU)*t;
  };
  pt.forEach((p,i)=>p.y=quota(acc[i]));

  for(let i=0;i<N;i++){
    const a=pt[i], b=pt[i+1];
    const dx=b.x-a.x, dz=b.z-a.z, dy=b.y-a.y;
    const oriz=Math.hypot(dx,dz), len=Math.hypot(oriz,dy)*1.08;
    const yaw=Math.atan2(-dz,dx), pend=-Math.atan2(dy,oriz);
    const mx=(a.x+b.x)/2, my=(a.y+b.y)/2, mz=(a.z+b.z)/2;
    B.add(new THREE.BoxGeometry(len,.5,VIA.w),CONC,mx,my,mz,0,yaw,pend,len/3,VIA.w/4);
    B.add(new THREE.BoxGeometry(len,.08,VIA.w-.9),ASF,mx,my+.28,mz,0,yaw,pend,len/3,2);
    [-1,1].forEach(k=>{
      const nx=Math.cos(yaw+Math.PI/2)*k*(VIA.w/2-.1), nz=-Math.sin(yaw+Math.PI/2)*k*(VIA.w/2-.1);
      B.add(new THREE.BoxGeometry(len,1.05,.3),PARA,mx+nx,my+.72,mz+nz,0,yaw,pend,len/3,1);
      B.add(new THREE.BoxGeometry(len,.12,.42),STEEL,mx+nx,my+1.30,mz+nz,0,yaw,pend);
    });
    if(i%2===0)B.add(new THREE.BoxGeometry(len*.5,.03,.18),PAINT,mx,my+.33,mz,0,yaw,pend);
    /* Sopra il fiume si va sempre su pile, anche dove l'impalcato e' basso:
       col criterio della sola quota ci finiva il rilevato pieno, che in mezzo
       al canale sarebbe una diga. */
    const sopraFiume=Math.abs(mz-FIUME.z)<FIUME.sem+2.5;
    if(i%8===4 && (my>2.2||sopraFiume) && !GROUND.blocked(mx,mz,2.6)){
      const dentro=Math.abs(mz-FIUME.z)<FIUME.sem;
      const base=dentro?FIUME.fondo:0;
      const h=my-base-.35;
      B.add(new THREE.CylinderGeometry(.95,1.15,h,10),CONC,mx,base+h/2,mz,0,0,0,1,3);
      B.add(new THREE.BoxGeometry(3.4,.7,3.4),CONC,mx,my-.62,mz,0,yaw,0,1,1);
      if(!dentro)GROUND.addWall(mx,mz,2.2,2.2);
    }
    /* Rilevato sotto la parte bassa. Prima erano blocchi separati, uno ogni
       quattro segmenti, ciascuno alto quanto l'impalcato in quel punto: da fuori
       leggevano come una scalinata. Ora ogni segmento ha il suo, inclinato come
       la carreggiata e affondato sotto terra, cosi' i pezzi si toccano e il
       fianco sale liscio come un rilevato autostradale. */
    if(my>.30 && my<=2.6 && !sopraFiume)
      B.add(new THREE.BoxGeometry(len*1.02,my+4,VIA.w-1.0),CONC,
            mx,my/2-2,mz,0,yaw,pend,len/3,1);
  }
  B.flush(scene,true,true);
})();

/* La corrente: due lastre che scorrono a velocita' diverse nello stesso verso,
   piu' la schiuma di sponda che avanza piu' piano. Il disallineamento fra i due
   disegni fa il luccichio, e costa due somme per frame invece di uno shader. */
function updateFiume(t){
  // Water anima il proprio riflesso da questo uniform: e' il suo orologio
  FIUME_G.acqua.material.uniforms.time.value=t*.62;
  FIUME_G.schiuma.forEach((s,i)=>{s.offset.x=-t*.014-i*.5;});

  /* L'onda: somma di tre seni con lunghezze e versi diversi. Una sola sinusoide
     legge come una lamiera ondulata che scorre; ne bastano tre incommensurabili
     perche' il moto non si ripeta a occhio. Il vertice si sposta lungo la z
     locale, che dopo la rotazione del piano e' l'altezza nel mondo. */
  const p=FIUME_G.onda.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i), y=p.getY(i);
    p.setZ(i, Math.sin(x*.16+t*1.15)*.125
            + Math.sin(x*.071-y*.13+t*.78)*.095
            + Math.sin(y*.29+t*1.9)*.045);
  }
  p.needsUpdate=true;

  /* I luccichii si accendono e si spengono uno a uno. Non si puo' farlo con
     l'opacita': PointsMaterial ne ha una sola per l'intera nuvola, e mediando
     duecentosessanta lampeggi resta una costante. Si spegne un punto
     affondandolo sotto la lastra opaca, che lo nasconde. */
  const G2=FIUME_G.glint, gp=G2.gg.attributes.position;
  for(let i=0;i<G2.semi.length;i++){
    const s=G2.semi[i], x=gp.getX(i);
    const on=Math.sin(t*s.f+s.p);
    gp.setY(i, on>.45 ? FIUME.y+.14+Math.sin(x*.16+t*1.15)*.125
                      : FIUME.y-.60);
  }
  gp.needsUpdate=true;
}

function updateLife(dt,t){
  updateFiume(t);
  // passanti
  npcs.forEach(n=>{
    if(n.idle){
      const dx=player.position.x-n.g.position.x, dz=player.position.z-n.g.position.z;
      if(dx*dx+dz*dz<90)n.h.lookAt(player.position); else n.h.headP.rotation.y*=.92;
      n.h.pose(t*1.1,.06);
      return;
    }
    const stop=(phase!=='idle')&&Math.abs(n.g.position.z)<6.4;
    if(!stop){
      n.g.position.z+=n.dir*n.speed*dt;
      n.ph+=dt*n.speed*5.5;
      if(n.g.position.z>28){n.dir=-1;}
      if(n.g.position.z<-28){n.dir=1;}
    }else{
      n.g.position.z-=n.dir*Math.max(0,Math.abs(n.g.position.z)-6.4<0?0:0)*dt;
      n.ph*=.9;
    }
    n.h.pose(n.ph,1);
    n.g.rotation.y=n.dir>0?0:Math.PI;
    const dd=n.g.position.distanceTo(player.position);
    if(dd<7)n.h.lookAt(player.position); else n.h.headP.rotation.y*=.9;
  });
  CLOUDS.rotation.y+=dt*.0035;
  // gatto: coda che ondeggia, si volta ogni tanto
  cat.tail.rotation.z=.7+Math.sin(t*2)*.35;
  cat.g.rotation.y=1.2+Math.sin(t*.25)*.6;
  // uccelli
  birds.forEach(b=>{
    const u=b.userData;u.a+=u.sp*dt;
    b.position.set(Math.cos(u.a)*u.r,u.y+Math.sin(u.a*2)*1.4,Math.sin(u.a)*u.r);
    b.rotation.y=-u.a;
    const flap=Math.sin(t*9+u.f)*.5;
    b.children[0].rotation.z=.4+flap;b.children[1].rotation.z=-.4-flap;
  });
  // verde che ondeggia nella brezza
  for(let i=0;i<SWAY.length;i++){
    const o=SWAY[i];
    o.rotation.z=Math.sin(t*.9+i)*.022;
    o.rotation.x=Math.cos(t*.7+i*.6)*.016;
  }
  // lucciole
  const fa=fireflies.g.attributes.position.array;
  for(let i=0;i<fa.length/3;i++){
    const d=fireflies.d[i];
    fa[i*3]+=Math.sin(t*d.sp+d.ph)*.4*dt;
    fa[i*3+1]+=Math.cos(t*d.sp*1.3+d.ph)*.3*dt;
    fa[i*3+2]+=Math.cos(t*d.sp+d.ph*1.7)*.4*dt;
    if(Math.abs(fa[i*3]-player.position.x)>30)fa[i*3]=player.position.x+rnd(-20,20);
    if(Math.abs(fa[i*3+2]-player.position.z)>30)fa[i*3+2]=player.position.z+rnd(-20,20);
    fa[i*3+1]=Math.max(.3,Math.min(3.6,fa[i*3+1]));
  }
  fireflies.g.attributes.position.needsUpdate=true;
}

/* ============ controlli ============ */
let yaw=Math.PI,pitch=-.1,firstPerson=false;
const move={x:0,y:0};let running=false;
const pad=document.getElementById('pad'),nub=document.getElementById('nub');
let padId=null,lookId=null,lx=0,ly=0;
function padSet(t){const r=pad.getBoundingClientRect();
  let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
  const mx=r.width/2-13,l=Math.hypot(dx,dy);if(l>mx){dx*=mx/l;dy*=mx/l;}
  nub.style.transform=`translate(${dx}px,${dy}px)`;move.x=dx/mx;move.y=dy/mx;}
function padEnd(){move.x=move.y=0;nub.style.transform='';padId=null;}
pad.addEventListener('touchstart',e=>{e.preventDefault();padId=e.changedTouches[0].identifier;padSet(e.changedTouches[0]);},{passive:false});
pad.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===padId)padSet(t);},{passive:false});
['touchend','touchcancel'].forEach(v=>pad.addEventListener(v,e=>{for(const t of e.changedTouches)if(t.identifier===padId)padEnd();}));
const runBtn=document.getElementById('run');
runBtn.addEventListener('touchstart',e=>{e.preventDefault();running=true;runBtn.classList.add('on');},{passive:false});
['touchend','touchcancel'].forEach(v=>runBtn.addEventListener(v,()=>{running=false;runBtn.classList.remove('on');}));
document.getElementById('view').addEventListener('click',()=>{firstPerson=!firstPerson;});
renderer.domElement.addEventListener('touchstart',e=>{if(lookId===null){
  lookId=e.changedTouches[0].identifier;lx=e.changedTouches[0].clientX;ly=e.changedTouches[0].clientY;}},{passive:false});
renderer.domElement.addEventListener('touchmove',e=>{for(const t of e.changedTouches)if(t.identifier===lookId){
  yaw-=(t.clientX-lx)*.006;pitch=Math.max(-.55,Math.min(.4,pitch-(t.clientY-ly)*.004));
  lx=t.clientX;ly=t.clientY;}},{passive:false});
['touchend','touchcancel'].forEach(v=>renderer.domElement.addEventListener(v,e=>{
  for(const t of e.changedTouches)if(t.identifier===lookId)lookId=null;}));
let md=false;
renderer.domElement.addEventListener('mousedown',e=>{md=true;lx=e.clientX;ly=e.clientY;});
addEventListener('mouseup',()=>md=false);
addEventListener('mousemove',e=>{if(!md)return;yaw-=(e.clientX-lx)*.005;
  pitch=Math.max(-.55,Math.min(.4,pitch-(e.clientY-ly)*.003));lx=e.clientX;ly=e.clientY;});
const keys={};
addEventListener('keydown',e=>{keys[e.code]=true;
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')running=true;
  if(e.code==='KeyV'||e.code==='F5'){e.preventDefault();firstPerson=!firstPerson;}
});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='ShiftLeft'||e.code==='ShiftRight')running=false;});

/* ============ audio ============ */
let actx=null;
function ding(hi){
  if(!actx)return;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='sine';o.frequency.value=hi?960:760;
  g.gain.setValueAtTime(.0001,actx.currentTime);
  g.gain.exponentialRampToValueAtTime(.07,actx.currentTime+.008);
  g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+.4);
  o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+.41);
}
function horn(){
  if(!actx)return;
  [0,.55].forEach(off=>{
    const o=actx.createOscillator(),o2=actx.createOscillator(),g=actx.createGain();
    o.type='sawtooth';o.frequency.value=232;o2.type='sawtooth';o2.frequency.value=310;
    const t=actx.currentTime+off;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.05,t+.08);
    g.gain.exponentialRampToValueAtTime(.0001,t+.5);
    const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
    o.connect(f);o2.connect(f);f.connect(g).connect(actx.destination);
    o.start(t);o2.start(t);o.stop(t+.52);o2.stop(t+.52);
  });
}
let rumble=null;
function trainSound(on){
  if(!actx)return;
  if(on&&!rumble){
    const b=actx.createBufferSource(),len=actx.sampleRate*2;
    const buf=actx.createBuffer(1,len,actx.sampleRate),dat=buf.getChannelData(0);
    for(let i=0;i<len;i++)dat[i]=(Math.random()*2-1)*.5;
    b.buffer=buf;b.loop=true;
    const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=420;
    const g=actx.createGain();g.gain.value=0;
    b.connect(f).connect(g).connect(actx.destination);b.start();
    rumble={src:b,gain:g};
  }
  if(rumble)rumble.gain.gain.setTargetAtTime(on?.16:0,actx.currentTime,.5);
}

/* ---------- incarichi ---------- */
const ITEMS=['un sacchetto di pane caldo','un mazzo di peonie','una lettera','un ombrello dimenticato',
  'una scatola di dolci','un libro di scuola','un thermos di tè'];
function otherNpc(exceptId){
  const c=npcs.filter(n=>n.id&&n.id!==exceptId);
  return c[(Math.random()*c.length)|0];
}
function newQuest(giver){
  const roll=Math.random();
  if(roll<.42){
    const to=otherNpc(giver.id), item=ITEMS[(Math.random()*ITEMS.length)|0];
    return {kind:'consegna',giver:giver.id,giverName:giver.name,to:to.id,toName:to.name,item,
      t:78,max:78,
      ask:`Mi porteresti ${item} a ${to.name}? Fai in fretta, prima che il quartiere si addormenti.`,
      label:`Porta <b>${item}</b> a <b>${to.name}</b>`};
  }
  if(roll<.72){
    const keys=Object.keys(PLACES), k=keys[(Math.random()*keys.length)|0];
    return {kind:'luogo',giver:giver.id,giverName:giver.name,place:k,
      ask:`Vai a dare un'occhiata a ${PLACES[k].n}? Con calma, non c'è fretta.`,
      label:`Raggiungi <b>${PLACES[k].n}</b>`};
  }
  const need=4+((Math.random()*3)|0);
  return {kind:'petali',giver:giver.id,giverName:giver.name,need,got:0,
    ask:`Mi raccogli ${need} petali? Sono per il santuario. Prenditi il tempo che vuoi.`,
    label:`Raccogli petali: <b>0/${need}</b>`};
}

/* ---------- petali raccoglibili ---------- */
const pickGeo=new THREE.SphereGeometry(.17,10,8);
const pickMat=new THREE.MeshBasicMaterial({color:0xffd9ea});
function spawnPickups(n){
  clearPickups();
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(pickGeo,pickMat);
    let x,z;do{x=rnd(-8.6,8.6);z=rnd(-27,27);}while(Math.abs(z)<7);
    m.position.set(x,.7,z);scene.add(m);
    const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,
      depthWrite:false,opacity:.75,color:0xffc9e0}));
    halo.scale.set(1.5,1.5,1);m.add(halo);
    halo.layers.set(1);           // gli aloni non devono generare contorni
    G.pickups.push(m);
  }
}
function clearPickups(){G.pickups.forEach(m=>scene.remove(m));G.pickups=[];}

/* ---------- dialogo ---------- */
let dlgQueue=[],dlgAfter=null;
function speak(name,lines,after){
  G.talking=true;dlgQueue=lines.slice();dlgAfter=after||null;
  $who.textContent=name;$dlg.style.display='block';$ch.innerHTML='';$goT.style.display='block';
  nextLine();
}
function nextLine(){
  if(!dlgQueue.length){
    if(dlgAfter){const f=dlgAfter;dlgAfter=null;f();return;}
    closeDlg();return;
  }
  $txt.textContent=dlgQueue.shift();
}
function closeDlg(){$dlg.style.display='none';G.talking=false;$ch.innerHTML='';}
$dlg.addEventListener('click',e=>{if(e.target.tagName==='BUTTON')return;if($ch.children.length)return;nextLine();});
function choices(list){
  $goT.style.display='none';$ch.innerHTML='';
  list.forEach((c,i)=>{
    const b=document.createElement('button');b.textContent=c.t;if(i)b.className='alt';
    b.addEventListener('click',ev=>{ev.stopPropagation();$ch.innerHTML='';c.f();});
    $ch.appendChild(b);
  });
}

function talkTo(n){
  const L=LINES[n.id]||{hi:['...']};
  const warm=G.aff[n.id]>=3&&L.warm;
  const pool=warm?L.hi.concat(L.warm):L.hi;
  const line=pool[(Math.random()*pool.length)|0];

  // consegna in corso destinata a lui
  if(G.quest&&G.quest.kind==='consegna'&&G.quest.to===n.id&&G.carrying){
    speak(n.name,[`Oh! ${G.carrying}. Sei arrivato in tempo, grazie di cuore.`],()=>{
      completeQuest();closeDlg();});
    return;
  }
  // rapporto col committente mentre l'incarico è aperto
  if(G.quest&&G.quest.giver===n.id){
    speak(n.name,[line,'Ci stai ancora pensando? Fai con calma, ma non troppa.'],closeDlg);
    return;
  }
  if(G.quest){speak(n.name,[line],closeDlg);return;}

  speak(n.name,[line],()=>{
    const q=newQuest(n);
    $txt.textContent=q.ask;$who.textContent=n.name;
    choices([
      {t:'Ci penso io',f:()=>{acceptQuest(q,n);closeDlg();}},
      {t:'Magari dopo',f:()=>{closeDlg();}}
    ]);
  });
}
function acceptQuest(q,n){
  G.quest=q;G.lastGiver=n.id;
  if(q.kind==='consegna'){G.carrying=q.item;$bar.style.display='block';}
  if(q.kind==='petali')spawnPickups(q.need+3);
  setObj(q.label);
  toast(q.kind==='consegna'?'Corri! Il tempo scorre':'Nuovo incarico');
}
function completeQuest(){
  const q=G.quest;if(!q)return;
  G.aff[q.giver]=(G.aff[q.giver]||0)+1;
  if(q.kind==='consegna')G.aff[q.to]=(G.aff[q.to]||0)+1;
  G.quest=null;G.carrying=null;G.done++;
  $bar.style.display='none';clearPickups();setObj(null);
  toast('Fatto! Il quartiere ti conosce un po\' di più');
  if(G.done%3===0){G.day++;toast('È passato un altro giorno · Giorno '+G.day);}
}
function failQuest(msg){
  const q=G.quest;if(!q)return;
  G.quest=null;G.carrying=null;$bar.style.display='none';clearPickups();setObj(null);
  toast(msg||'Troppo tardi... ma non è grave');
}

/* ---------- ciclo del giorno ---------- */
const KEY=[
  {t:0.00,sun:0xffcaa0,si:1.15,hs:0xffd9c4,hg:0x6b5a76,hi:.75,fog:0xf3d3b4,sky:0xffd9bc,y:6,  n:'Alba'},
  {t:0.28,sun:0xfdf0e2,si:1.32,hs:0xcfe2f4,hg:0x8e8ea6,hi:.72,fog:0xd2e2f2,sky:0xb8d2ef,y:26,n:'Mattina'},
  {t:0.55,sun:0xfdf1dc,si:1.28,hs:0xd2e2f6,hg:0x8a8896,hi:.70, fog:0xd6e2f0,sky:0xc0d8ee,y:22,n:'Pomeriggio'},
  {t:0.75,sun:0xffd6ac,si:2.05,hs:0xffd2c8,hg:0x6d6180,hi:.92, fog:0xf6c9a6,sky:0xfff2e0,y:8, n:'Tramonto'},
  {t:0.88,sun:0xc9a0d0,si:.85, hs:0xa294c8,hg:0x453d5c,hi:.72, fog:0xb094b4,sky:0xb69cc4,y:3, n:'Crepuscolo'},
  {t:1.00,sun:0x8fa0dc,si:.45, hs:0x5a6aa0,hg:0x2c2842,hi:.55, fog:0x55608c,sky:0x6d7aa8,y:2, n:'Notte'}
];
const cA=new THREE.Color(),cB=new THREE.Color();
function applyDay(){
  let i=0;while(i<KEY.length-2&&G.time>KEY[i+1].t)i++;
  const a=KEY[i],b=KEY[i+1],k=Math.max(0,Math.min(1,(G.time-a.t)/(b.t-a.t)));
  // le tinte sono sRGB: vanno linearizzate, la scena lavora in lineare
  lerpSRGB(sun.color,a.sun,b.sun,k);
  sun.intensity=a.si+(b.si-a.si)*k;
  lerpSRGB(hemi.color,a.hs,b.hs,k);
  lerpSRGB(hemi.groundColor,a.hg,b.hg,k);
  hemi.intensity=a.hi+(b.hi-a.hi)*k;
  lerpSRGB(scene.fog.color,a.fog,b.fog,k);
  scene.background.copy(scene.fog.color);
  lerpSRGB(sky.material.color,a.sky,b.sky,k);
  // le nuvole prendono la luce del cielo, il ventre resta sulla tinta d'orizzonte
  lerpSRGB(cloudTop.color,a.sky,b.sky,k).lerp(new THREE.Color(1,1,1),.35);
  lerpSRGB(cloudBot.color,a.fog,b.fog,k).multiplyScalar(.82);
  // il rimbalzo dal suolo e' la luce chiave filtrata dall'asfalto
  lerpSRGB(bounce.color,a.sun,b.sun,k);
  bounce.intensity=(a.si+(b.si-a.si)*k)*.30;
  sunH=a.y+(b.y-a.y)*k;
  /* L'acqua e' dipinta con un materiale che non riceve luce — cosi' resta piatta
     e cartoon — ma per la stessa ragione restava ciano da mezzogiorno mentre il
     resto della scena era al tramonto. La si tinge a mano col colore del cielo:
     un fiume rispecchia cio' che ha sopra, ed e' esattamente quel legame che
     mancava perche' sembrasse parte della stessa illustrazione.  */
  if(typeof FIUME_G!=='undefined'){
    const u=FIUME_G.acqua.material.uniforms;
    /* Il colore proprio dell'acqua resta blu e prende solo un soffio di cielo:
       tinta puramente col cielo diventava uno specchio rosa in cui il fiume
       spariva. Un fiume riflette, ma ha anche un colore suo. */
    lerpSRGB(u.waterColor.value,a.fog,b.fog,k).lerp(_acquaBlu,.80);
    lerpSRGB(u.sunColor.value,a.sun,b.sun,k);
    u.sunDirection.value.set(Math.cos(sunH*.0175),Math.sin(sunH*.0175),.2).normalize();
  }
  const hh=Math.floor(G.time*24),mm=Math.floor((G.time*24%1)*60);
  $clock.textContent=`Giorno ${G.day} · ${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')} · ${a.n}`;
}
let sunH=9;
const _acquaBlu=new THREE.Color(0x67b4d8).convertSRGBToLinear();

/* ---------- aggiornamento di gioco ---------- */
function updateGame(dt){
  G.time+=dt*G.speedDay;
  if(G.time>=1){G.time=0;G.day++;toast('Giorno '+G.day);}
  applyDay();

  // azione vicina
  nearNpc=null;let best=3.4;
  npcs.forEach(n=>{
    const d=n.g.position.distanceTo(player.position);
    if(d<best){best=d;nearNpc=n;}
  });
  if(nearNpc&&!G.talking){
    $act.style.display='block';
    $act.textContent=(G.quest&&G.quest.to===nearNpc.id&&G.carrying)?`CONSEGNA a ${nearNpc.name}`:`PARLA con ${nearNpc.name}`;
  }else $act.style.display='none';

  const q=G.quest;
  if(q){
    if(q.kind==='consegna'){
      q.t-=dt;$barI.style.width=Math.max(0,q.t/q.max*100)+'%';
      if(q.t<=0)failQuest('Il tempo è scaduto. ' + q.toName + ' capirà.');
    }
    if(q.kind==='luogo'){
      if(player.position.distanceTo(PLACES[q.place].p)<3.4){
        speak('Tu',[`Eccolo. ${PLACES[q.place].n}, proprio come diceva ${q.giverName}.`],()=>{completeQuest();closeDlg();});
      }
    }
    if(q.kind==='petali'){
      for(let i=G.pickups.length-1;i>=0;i--){
        const m=G.pickups[i];
        m.rotation.y+=dt*2;m.position.y=.7+Math.sin(clock.elapsedTime*2+i)*.12;
        if(m.position.distanceTo(player.position)<1.3){
          scene.remove(m);G.pickups.splice(i,1);q.got++;
          setObj(`Raccogli petali: <b>${q.got}/${q.need}</b>`);
          if(q.got>=q.need){
            toast('Petali raccolti · torna da '+q.giverName);
            setObj(`Riporta i petali a <b>${q.giverName}</b>`);
            q.kind='ritorno';
          }
        }
      }
    }
    if(q.kind==='ritorno'&&nearNpc&&nearNpc.id===q.giver&&!G.talking){
      $act.textContent=`CONSEGNA a ${nearNpc.name}`;
    }
  }
}
/* consegna dei petali al committente */
const _talkTo=talkTo;
talkTo=function(n){
  const q=G.quest;
  if(q&&q.kind==='ritorno'&&q.giver===n.id){

      G.quest.kind='petali';completeQuest();closeDlg();});
    return;
  }
  _talkTo(n);
};

  {p:new THREE.Vector3(74,44,92),   l:new THREE.Vector3(10,6,-10)},
  {p:new THREE.Vector3(46,26,58),   l:new THREE.Vector3(0,4,0)},
  {p:new THREE.Vector3(24,13,34),   l:new THREE.Vector3(0,3,0)},
  {p:new THREE.Vector3(11,6.5,20),  l:new THREE.Vector3(0,2,4)},
  {p:new THREE.Vector3(4,3.4,20.5), l:new THREE.Vector3(0,1.6,16)}
];
function startCine(){
  CINE.on=true;CINE.t=0;CINE.step=0;
  cine.style.display='block';
  scene.fog.far=900;scene.fog.near=140;
  $title.classList.add('on');
  showLore(0);
  setTimeout(()=>$title.classList.remove('on'),4200);
}
function showLore(i){
  $lore.classList.remove('on');
  setTimeout(()=>{$lore.textContent=LORE[i]||'';if(LORE[i])$lore.classList.add('on');},520);
}
function endCine(){
  CINE.on=false;
  CINE.on=false;cine.style.display='none';
  scene.fog.near=58;scene.fog.far=380;
  G.time=.78;applyDay();   // si comincia di sera, col sole gia' basso
  setObj('Sei tornato. Trova qualcuno con cui parlare: sono <b>sei</b> in questo quartiere.');
  say('Avvicinati a qualcuno e premi PARLA',4200);
}
cine.querySelector('#skip').addEventListener('click',endCine);
function updateCine(dt){
  CINE.t+=dt;
  const seg=Math.min(camPath.length-2, Math.floor(CINE.t/CINE.dur));
  const k=Math.min(1,(CINE.t-seg*CINE.dur)/CINE.dur);
  const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
  const a=camPath[seg],b=camPath[seg+1];
  camera.position.lerpVectors(a.p,b.p,e);
  const look=new THREE.Vector3().lerpVectors(a.l,b.l,e);
  camera.lookAt(look);
  const st=Math.floor(CINE.t/CINE.dur);
  if(st!==CINE.step){CINE.step=st;showLore(st);}
  if(CINE.t>CINE.dur*(camPath.length-1)+1.2)endCine();
}

/* ============================================================
   GESTIONE COLORE
   Tutti i colori del progetto sono scritti come esadecimali sRGB (quelli che
   si scelgono a occhio). Da qui in poi la scena viene disegnata in spazio
   lineare e riconvertita in sRGB solo alla fine, quindi vanno linearizzati:
   altrimenti ogni tinta risulta slavata e le ombre si schiariscono.
   ============================================================ */
const _colA=new THREE.Color(),_colB=new THREE.Color();
function setSRGB(target,hex){return target.setHex(hex).convertSRGBToLinear();}
function lerpSRGB(target,a,b,k){
  // si interpola in sRGB (dove le palette sono state scelte) e si converte dopo
  return target.copy(_colA.setHex(a)).lerp(_colB.setHex(b),k).convertSRGBToLinear();
}
(function linearizeScene(){
  const seen=new Set();
  const doMat=m=>{
    if(!m||seen.has(m))return;seen.add(m);
    if(m.color)m.color.convertSRGBToLinear();
    if(m.emissive)m.emissive.convertSRGBToLinear();
  };
  scene.traverse(o=>{
    if(o.material)(Array.isArray(o.material)?o.material:[o.material]).forEach(doMat);
    if(o.isLight){
      o.color.convertSRGBToLinear();
      if(o.groundColor)o.groundColor.convertSRGBToLinear();
    }
  });
  doMat(pickMat);   // materiali non ancora appesi alla scena
  doMat(bladeMat);
  scene.fog.color.convertSRGBToLinear();
  if(scene.background&&scene.background.isColor)scene.background.convertSRGBToLinear();
})();

/* ============================================================
   COMPOSIZIONE: prepass normali+profondita' -> contorni a inchiostro,
   bloom sulle luci, tone mapping ACES, grade e vignettatura.
   Un solo shader finale, cosi' il tratto cartoon e' identico ovunque.
   ============================================================ */
const POST=(()=>{
  const QUAD=new THREE.PlaneGeometry(2,2);
  const QCAM=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const mkPass=(frag,uniforms)=>{
    const mat=new THREE.ShaderMaterial({uniforms,depthTest:false,depthWrite:false,
      vertexShader:`varying vec2 vUv;
        void main(){vUv=uv;gl_Position=vec4(position.xy,0.0,1.0);}`,
      fragmentShader:'varying vec2 vUv;\n'+frag});
    const sc=new THREE.Scene();sc.add(new THREE.Mesh(QUAD,mat));
    return {sc,mat,u:uniforms};
  };

  const opt={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,
             format:THREE.RGBAFormat,type:THREE.HalfFloatType,stencilBuffer:false};
  const MS=renderer.capabilities.isWebGL2&&THREE.WebGLMultisampleRenderTarget;
  const sceneRT=MS?new THREE.WebGLMultisampleRenderTarget(2,2,opt):new THREE.WebGLRenderTarget(2,2,opt);
  if(MS)sceneRT.samples=4;

  const normalRT=new THREE.WebGLRenderTarget(2,2,{
    minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,
    format:THREE.RGBAFormat,type:THREE.UnsignedByteType,stencilBuffer:false});
  normalRT.depthTexture=new THREE.DepthTexture(2,2,THREE.UnsignedIntType);

  const bopt={minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,
              format:THREE.RGBAFormat,type:THREE.HalfFloatType,
              depthBuffer:false,stencilBuffer:false};
  const brightRT=new THREE.WebGLRenderTarget(2,2,bopt);
  const blurRT=new THREE.WebGLRenderTarget(2,2,bopt);

  const normalMat=new THREE.MeshNormalMaterial();

  const bright=mkPass(`
    uniform sampler2D tScene;uniform float uThr,uKnee;
    void main(){
      vec3 c=texture2D(tScene,vUv).rgb;
      float l=dot(c,vec3(0.2126,0.7152,0.0722));
      float s=clamp((l-uThr)/max(uKnee,1e-4),0.0,1.0);
      gl_FragColor=vec4(c*s*s,1.0);
    }`,{tScene:{value:null},uThr:{value:0.75},uKnee:{value:0.7}});

  const blur=mkPass(`
    uniform sampler2D tSrc;uniform vec2 uDir;
    void main(){
      vec4 s=texture2D(tSrc,vUv)*0.2270270270;
      s+=(texture2D(tSrc,vUv+uDir*1.3846153846)+texture2D(tSrc,vUv-uDir*1.3846153846))*0.3162162162;
      s+=(texture2D(tSrc,vUv+uDir*3.2307692308)+texture2D(tSrc,vUv-uDir*3.2307692308))*0.0702702703;
      gl_FragColor=s;
    }`,{tSrc:{value:null},uDir:{value:new THREE.Vector2()}});

  const comp=mkPass(`
    uniform sampler2D tScene,tBloom,tNormal,tDepth;
    uniform vec2 uTexel;
    uniform float uNear,uFar,uThick,uNormalEdge,uDepthEdge,uBloom,uOutline;
    uniform float uVignette,uExposure,uSat,uGrain,uFade;
    uniform vec3 uInk,uLift;

    vec3 aces(vec3 x){
      return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);
    }
    vec3 toSRGB(vec3 c){
      return mix(c*12.92,1.055*pow(max(c,vec3(0.0)),vec3(1.0/2.4))-0.055,step(0.0031308,c));
    }
    float lin(vec2 uv){
      float d=texture2D(tDepth,uv).x;
      return (uNear*uFar)/(uFar-d*(uFar-uNear));
    }

    void main(){
      vec3 col=texture2D(tScene,vUv).rgb;

      /* --- contorno: croce di Roberts su profondita' e normali --- */
      vec2 o=uTexel*uThick;
      float dc=lin(vUv);
      float d0=lin(vUv+vec2(-o.x,-o.y)),d1=lin(vUv+vec2(o.x,o.y));
      float d2=lin(vUv+vec2(-o.x,o.y)),d3=lin(vUv+vec2(o.x,-o.y));
      float dE=sqrt((d1-d0)*(d1-d0)+(d3-d2)*(d3-d2))/max(dc,1.0);
      dE=smoothstep(uDepthEdge,uDepthEdge*3.0,dE);

      vec3 n0=texture2D(tNormal,vUv+vec2(-o.x,-o.y)).xyz;
      vec3 n1=texture2D(tNormal,vUv+vec2(o.x,o.y)).xyz;
      vec3 n2=texture2D(tNormal,vUv+vec2(-o.x,o.y)).xyz;
      vec3 n3=texture2D(tNormal,vUv+vec2(o.x,-o.y)).xyz;
      float nE=sqrt(dot(n1-n0,n1-n0)+dot(n3-n2,n3-n2));
      nE=smoothstep(uNormalEdge,uNormalEdge+0.30,nE);
      nE*=1.0-smoothstep(22.0,55.0,dc);      // le pieghe contano solo da vicino

      float edge=clamp(max(dE,nE*0.85),0.0,1.0)*uOutline;
      edge*=1.0-smoothstep(uFade*0.55,uFade,dc);

      col+=texture2D(tBloom,vUv).rgb*uBloom;
      /* inchiostro: tinta scura della superficie, mai nero piatto */
      col=mix(col,col*0.20+uInk*0.05,edge);

      col*=uExposure;
      col=aces(col);
      float l=dot(col,vec3(0.2126,0.7152,0.0722));
      col=mix(vec3(l),col,uSat);
      col+=uLift*(1.0-l)*0.12;

      float v=distance(vUv,vec2(0.5));
      col*=1.0-smoothstep(0.40,0.95,v)*uVignette;

      float g=fract(sin(dot(vUv*uGrain,vec2(12.9898,78.233)))*43758.5453);
      col+=(g-0.5)*0.010;

      gl_FragColor=vec4(toSRGB(col),1.0);
    }`,{
    tScene:{value:null},tBloom:{value:null},tNormal:{value:null},tDepth:{value:null},
    uTexel:{value:new THREE.Vector2()},
    uNear:{value:camera.near},uFar:{value:camera.far},
    uThick:{value:1.15},uNormalEdge:{value:0.30},uDepthEdge:{value:0.010},
    uBloom:{value:0.85},uOutline:{value:1.0},uVignette:{value:0.40},
    uExposure:{value:0.88},uSat:{value:1.16},uGrain:{value:1.0},uFade:{value:190.0},
    uInk:{value:new THREE.Color(0x2b2036)},uLift:{value:new THREE.Color(0x2e3a63)}});

  let W=2,H=2;
  function setSize(w,h,dpr){
    W=Math.max(2,Math.round(w*dpr));H=Math.max(2,Math.round(h*dpr));
    sceneRT.setSize(W,H);
    normalRT.setSize(W,H);
    normalRT.depthTexture.image.width=W;normalRT.depthTexture.image.height=H;
    normalRT.depthTexture.needsUpdate=true;
    const bw=Math.max(2,W>>2),bh=Math.max(2,H>>2);
    brightRT.setSize(bw,bh);blurRT.setSize(bw,bh);
    comp.u.uTexel.value.set(1/W,1/H);
  }

  /* Sprite, Points, Line e il cielo non devono generare contorni: li mettiamo
     sul layer 1, che il prepass delle normali non guarda. */
  camera.layers.enable(1);
  function noOutline(o){o.traverse(c=>c.layers.set(1));return o;}
  function autoTag(){
    scene.traverse(o=>{
      if(o.isSprite||o.isPoints||o.isLine)o.layers.set(1);
    });
  }

  function render(){
    const bg=scene.background;

    // 1. normali + profondita'
    camera.layers.disable(1);
    scene.overrideMaterial=normalMat;
    scene.background=null;
    renderer.setRenderTarget(normalRT);
    renderer.setClearColor(0x8080ff,1);
    renderer.clear();
    renderer.render(scene,camera);
    scene.overrideMaterial=null;
    scene.background=bg;
    camera.layers.enable(1);

    // 2. colore HDR
    renderer.setRenderTarget(sceneRT);
    renderer.clear();
    renderer.render(scene,camera);

    // 3. bloom
    bright.u.tScene.value=sceneRT.texture;
    renderer.setRenderTarget(brightRT);
    renderer.render(bright.sc,QCAM);
    const bw=brightRT.width,bh=brightRT.height;
    for(let i=0;i<2;i++){
      blur.u.tSrc.value=brightRT.texture;blur.u.uDir.value.set(1/bw,0);
      renderer.setRenderTarget(blurRT);renderer.render(blur.sc,QCAM);
      blur.u.tSrc.value=blurRT.texture;blur.u.uDir.value.set(0,1/bh);
      renderer.setRenderTarget(brightRT);renderer.render(blur.sc,QCAM);
    }

    // 4. composizione a schermo
    comp.u.tScene.value=sceneRT.texture;
    comp.u.tBloom.value=brightRT.texture;
    comp.u.tNormal.value=normalRT.texture;
    comp.u.tDepth.value=normalRT.depthTexture;
    comp.u.uNear.value=camera.near;comp.u.uFar.value=camera.far;
    comp.u.uGrain.value=(comp.u.uGrain.value+0.37)%97.0;
    renderer.setRenderTarget(null);
    renderer.render(comp.sc,QCAM);
  }

  return {render,setSize,noOutline,autoTag,u:comp.u};
})();
POST.autoTag();

/* ============ stato ============ */
let phase='idle',timer=9,gateT=0,bell=0,blink=0,bellHi=false;
const tip=document.getElementById('tip');
function say(t,ms){tip.textContent=t;tip.classList.add('show');clearTimeout(say._i);
  say._i=setTimeout(()=>tip.classList.remove('show'),ms||3000);}

const PLAYER_R=.36;      // raggio del cilindro di collisione
const STEP_UP=.55;       // dislivello che si supera camminando
const clock=new THREE.Clock();let walkT=0;
const camPos=new THREE.Vector3(0,4,24);
const OB=[];  // ostacoli semplici (cerchi)
houses.forEach(h=>OB.push({x:h[0],z:h[1],r:4}));

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05);
  cityBlinkers.forEach((b,i)=>{setSRGB(b.material.color,Math.sin(clock.elapsedTime*2+i)>0?0xff6b6b:0x5a2430);});
  if(CINE.on){
    updateCine(dt);
    updateLife(dt,clock.elapsedTime);
    if(typeof fit==='function')fit();
    POST.render();
    return;
  }
  let ix=move.x,iz=move.y;
  if(G.talking){ix=0;iz=0;}
  if(keys['KeyW'])iz-=1;if(keys['KeyS'])iz+=1;if(keys['KeyA'])ix-=1;if(keys['KeyD'])ix+=1;
  const len=Math.hypot(ix,iz), sp=running?6.6:3.2;
  if(len>.08){
    const k=Math.max(len,1),nx=ix/k,nz=iz/k,s=Math.sin(yaw),c=Math.cos(yaw);
    // La camera guarda lungo avanti=(sin yaw, cos yaw); la destra della camera e'
    // il prodotto vettoriale con l'alto, cioe' (-cos yaw, sin yaw).
    // Nel codice originale entrambe le componenti erano sbagliate di segno:
    // W portava indietro e A/D risultavano scambiati.
    const fwd=-nz;                      // W da' iz=-1, che e' "avanti"
    const dx=(-nx*c+fwd*s)*sp*dt;
    const dz=( nx*s+fwd*c)*sp*dt;
    const px=player.position.x, pz=player.position.z, py=player.position.y;

    // il passaggio a livello si chiude davvero quando arriva il treno
    const railBlock=(phase!=='idle')&&Math.abs(pz)>=RAIL_HALF-1.2;
    let tx=px+dx, tz=pz+dz;
    if(railBlock&&Math.abs(tz)<RAIL_HALF-1.2){
      tz=Math.sign(pz)*(RAIL_HALF-1.2);
      if(Math.random()<.02)say('Aspetta, sta arrivando il treno',1600);
    }

    // assi separati: contro un muro si scivola invece di incastrarsi
    let mx=px, mz=pz;
    if(!GROUND.blocked(tx,pz,PLAYER_R)&&GROUND.heightAt(tx,pz)-py<=STEP_UP)mx=tx;
    if(!GROUND.blocked(mx,tz,PLAYER_R)&&GROUND.heightAt(mx,tz)-py<=STEP_UP)mz=tz;
    player.position.x=mx;player.position.z=mz;

    walkT+=dt*(running?13:8.5);
    player.rotation.y=Math.atan2(dx,dz);
  }else walkT*=.85;

  // il personaggio segue la quota del suolo: sale sui cordoli, non li attraversa
  {
    const gy=GROUND.heightAt(player.position.x,player.position.z);
    player.position.y+=(gy-player.position.y)*Math.min(1,dt*14);
    if(Math.abs(gy-player.position.y)<.004)player.position.y=gy;
  }
  playerH.pose(walkT, len>.08?1:.08);

  // camera
  if(firstPerson){
    camera.position.set(player.position.x,player.position.y+1.62,player.position.z);
    camera.lookAt(player.position.x+Math.sin(yaw)*4,player.position.y+1.62+pitch*5,player.position.z+Math.cos(yaw)*4);
    player.visible=false;
  }else{
    player.visible=true;
    const dist=5.6,h=3.1;
    const want=new THREE.Vector3(
      player.position.x-Math.sin(yaw)*dist,
      player.position.y+h-pitch*4.5,
      player.position.z-Math.cos(yaw)*dist);
    camPos.lerp(want,1-Math.pow(.0018,dt));
    camera.position.copy(camPos);
    camera.lookAt(player.position.x,player.position.y+1.45+pitch*3,player.position.z);
  }
  sun.position.set(player.position.x+30,sunH,player.position.z-16);
  sun.target.position.copy(player.position);

  // ciclo treno
  timer-=dt;
  if(phase==='idle'&&timer<=0){phase='warn';timer=5.5;say('カンカンカン — le sbarre si abbassano',2600);}
  if(phase==='warn'){gateT=Math.min(1,gateT+dt/3);
    if(timer<=0){phase='pass';train.visible=true;train.position.set(-290,0,0);trainSound(true);horn();}}
  if(phase==='pass'){
    train.position.x+=34*dt;
    if(train.position.x>270){phase='open';train.visible=false;trainSound(false);}}
  if(phase==='open'){gateT=Math.max(0,gateT-dt/2.4);
    if(gateT<=0){phase='idle';timer=15+Math.random()*10;}}
  gates.forEach(g=>{g.pivot.rotation.z=-Math.PI/2*(1-gateT);});
  blink+=dt;
  const on=Math.sin(blink*7.5)>0;
  gates.forEach(g=>{
    g.lights.forEach((l,i)=>setSRGB(l.material.color,phase!=="idle"&&((i===0)===on)?0xff3b46:0x611f27));
    setSRGB(g.lamp.material.color,phase!=="idle"&&on?0xff5560:0x611f27);
  });
  if(phase!=='idle'){bell-=dt;if(bell<=0){ding(bellHi=!bellHi);bell=.42;}}

  // petali
  const a=pgeo.attributes.position.array;
  for(let i=0;i<PC;i++){const v=pv[i];
    a[i*3+1]-=v.y*dt;
    a[i*3]+=Math.sin(clock.elapsedTime*v.s+v.p)*.85*dt;
    a[i*3+2]+=Math.cos(clock.elapsedTime*v.s*.7+v.p)*.6*dt;
    if(a[i*3+1]<0){a[i*3]=player.position.x+rnd(-24,24);a[i*3+1]=rnd(11,16);a[i*3+2]=player.position.z+rnd(-24,24);}
  }
  pgeo.attributes.position.needsUpdate=true;
  updateLife(dt,clock.elapsedTime);
  updateGame(dt);
  if(typeof fit==="function")fit();
  POST.render();
}
/* dimensionamento robusto: funziona anche dentro un iframe di anteprima */
let lastW=0,lastH=0;
function fit(){
  const vv=window.visualViewport;
  const w=Math.round(document.documentElement.clientWidth||vv&&vv.width||innerWidth);
  const h=Math.round(document.documentElement.clientHeight||vv&&vv.height||innerHeight);
  if(w===lastW&&h===lastH)return;
  lastW=w;lastH=h;
  camera.aspect=w/h;camera.updateProjectionMatrix();
  renderer.setSize(w,h,false);
  POST.setSize(w,h,renderer.getPixelRatio());
}
fit();
addEventListener('resize',fit);
addEventListener('orientationchange',()=>setTimeout(fit,250));
if(window.visualViewport)visualViewport.addEventListener('resize',fit);
setInterval(fit,600);
document.getElementById('fs').addEventListener('click',()=>{
  const el=document.documentElement;
  if(!document.fullscreenElement){(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}
  else document.exitFullscreen();
  setTimeout(fit,300);
});
function start(){
  document.getElementById('veil').style.display='none';
  try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  fit();
  applyDay();
  // Si entra direttamente nel quartiere: la cinematica apriva su un nero
  // lungo trentatre secondi prima di mostrare qualcosa.
  endCine();
}
document.getElementById('go').addEventListener('click',start);
document.getElementById('veil').addEventListener('click',start);
tick();
</script>
